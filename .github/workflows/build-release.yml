name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # 允许工作流创建 GitHub Release（softprops/action-gh-release 需要 contents: write）
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        # 用 dist:ci（= electron-builder --win --publish never）：
        # build.publish 块要保留（它打进 app-update.yml，App 内自动更新靠它），
        # 但 electron-builder 默认 onTagOrDraft，在 tag 上会自动发布并索要 GH_TOKEN；
        # 这里禁止它发布，改由下面的 softprops 统一出 Release。
        run: npm run dist:ci
        env:
          NODE_OPTIONS: ''

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLower()
            "SHA256 ($($_.Name)) = $h"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*-setup.exe
            release/latest.yml
            release/*.blockmap
            release/SHA256SUMS.txt
