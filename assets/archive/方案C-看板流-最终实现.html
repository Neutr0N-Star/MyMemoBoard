<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星之间 · 看板流（方案 C）</title>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<style>
/* ========== tokens · B 琥珀夜灯 ========== */
:root{
  --bg:#1C140C;--bg-top:#221910;
  --t1:#F5E9D7;--t2:#C9B292;--t3:#99805D;
  --pri:#D98E2B;--sec:#A9702C;--acc:#FFB84D;
  --danger:#C65D4F;--danger-lt:#D97A6A;--success:#6E9B6B;--warn:#E08A3C;
  --glass:rgba(255,244,224,.07);
  --blur:blur(48px) saturate(180%);
  --edge:inset 0 1px 0 rgba(255,244,224,.35), inset 0 -1px 0 rgba(0,0,0,.35), 0 24px 48px -16px rgba(0,0,0,.55), 0 0 0 1px rgba(255,235,200,.14);
  --m-kaoyan:#FFB84D;--m-course:#D98E2B;--m-todo:#E08A3C;--m-life:#A9702C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;line-height:1.55;font-size:15px}
.bg-layer{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(60vw 70vh at 18% 6%, rgba(255,184,77,.5), transparent 65%),
    radial-gradient(40vw 40vh at 76% 28%, rgba(224,138,60,.26), transparent 70%),
    radial-gradient(72vw 60vh at 50% 108%, rgba(180,83,9,.16), transparent 70%),
    linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 60%,#14100A 100%)}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:18px;box-shadow:var(--edge)}
.wrap{max-width:1240px;margin:0 auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:none;border-radius:11px;font-size:13px;background:rgba(255,244,224,.08);color:var(--t1);transition:all .2s}
.btn:hover{background:rgba(255,244,224,.14)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--pri));color:#2A1B08;font-weight:600}
.btn.primary:hover{box-shadow:0 0 18px rgba(255,184,77,.4)}

header{display:flex;align-items:center;gap:10px;padding:11px 18px;margin-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700}
.brand svg{color:var(--acc);filter:drop-shadow(0 0 8px rgba(255,184,77,.6))}
.cd-pill{font-size:13px;color:var(--t2);padding:5px 13px;border-radius:20px;background:rgba(255,184,77,.10)}
.cd-pill b{color:var(--acc)}
.acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}

/* 模块筛选 */
.filters{display:flex;gap:7px;padding:9px 14px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filters .lb{font-size:12px;color:var(--t3);margin-right:2px}
.filters button{border:none;min-height:36px;padding:0 13px;border-radius:20px;background:rgba(255,244,224,.06);color:var(--t2);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.filters button .dot{width:8px;height:8px;border-radius:50%}
.filters button.on{background:rgba(255,184,77,.18);color:var(--t1)}

/* 看板 */
.main{display:grid;grid-template-columns:1fr 232px;gap:12px;align-items:start}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.col{border-radius:15px;padding:11px;min-height:210px;display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(180deg,rgba(255,244,224,.045),rgba(255,244,224,.015));
  box-shadow:inset 0 1px 0 rgba(255,235,200,.10);transition:background .18s,box-shadow .18s}
.col.dragover{background:rgba(255,184,77,.10);box-shadow:inset 0 0 0 1px rgba(255,184,77,.45)}
.col h3{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--t2);letter-spacing:.04em}
.col h3 .n{margin-left:auto;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.col h3 .ic{width:15px;height:15px;opacity:.75}
.col[data-col="today"] h3 .ic{color:var(--acc)}
.col[data-col="doing"] h3 .ic{color:var(--pri)}
.col[data-col="done"] h3 .ic{color:var(--success)}
.col .add{width:100%;min-height:38px;border:1px dashed rgba(255,235,200,.16);border-radius:10px;background:none;color:var(--t3);font-size:12px;margin-top:2px}
.col .add:hover{border-color:rgba(255,184,77,.5);color:var(--acc);background:rgba(255,184,77,.06)}

/* 卡片（可翻面） */
.card{perspective:900px}
.card-in{position:relative;transition:transform .5s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;min-height:64px}
.card.flip .card-in{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:11px;padding:10px 11px;
  background:linear-gradient(160deg,rgba(255,244,224,.085),rgba(255,244,224,.03));
  box-shadow:inset 0 1px 0 rgba(255,235,200,.14), 0 5px 14px -8px rgba(0,0,0,.8)}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;gap:6px}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:var(--mc,var(--pri))}
.face .t{font-size:13.5px;line-height:1.45;word-break:break-word;cursor:pointer;padding-left:5px}
.face .m{font-size:11px;color:var(--t3);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;padding-left:5px}
.face .m .over{color:var(--danger-lt)}
.face .m .soon{color:var(--warn)}
.face .ops{display:flex;gap:3px;margin-top:8px;padding-left:5px;opacity:0;transition:opacity .18s}
.card:hover .face .ops{opacity:1}
.face .ops button{width:26px;height:26px;border:none;border-radius:7px;background:rgba(255,244,224,.07);color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:13px}
.face .ops button:hover{background:rgba(255,184,77,.2);color:var(--t1)}
.face .ops .mv{margin-left:auto}
.face.back textarea{flex:1;width:100%;min-height:56px;resize:none;border:1px solid rgba(255,235,200,.14);border-radius:8px;background:rgba(255,244,224,.05);color:var(--t1);padding:7px 9px;font-size:12.5px;line-height:1.5}
.face.back textarea:focus{outline:none;border-color:rgba(255,184,77,.5)}
.face.back .bk{display:flex;gap:5px}
.face.back .bk button{flex:1;min-height:32px;border:none;border-radius:8px;background:rgba(255,244,224,.08);color:var(--t2);font-size:12px}
.face.back .bk button:hover{background:rgba(255,184,77,.18);color:var(--t1)}
.card.done .face .t{text-decoration:line-through;color:var(--t3)}
.card[draggable="true"]{cursor:grab}
.card.ghost{opacity:.35}

/* 侧栏 */
.side{display:flex;flex-direction:column;gap:11px;position:sticky;top:14px}
.side .boxx{padding:14px 15px}
.side h3{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--t2);margin-bottom:10px}
.side h3 svg{color:var(--pri);width:15px;height:15px}
.srow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed rgba(255,235,200,.10);font-size:13px}
.srow:last-child{border-bottom:none}
.srow .tm{width:40px;flex:none;font-size:11.5px;color:var(--acc);cursor:pointer;font-variant-numeric:tabular-nums}
.srow .lb{flex:1;color:var(--t2);cursor:pointer}
.srow .lb:hover{color:var(--t1)}
.srow .del{width:20px;height:20px;border:none;background:none;color:var(--t3);opacity:0;display:flex;align-items:center;justify-content:center}
.srow:hover .del{opacity:1}
.srow .del:hover{color:var(--danger-lt)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.stat .k{padding:9px 11px;border-radius:10px;background:rgba(255,244,224,.045);box-shadow:inset 0 1px 0 rgba(255,235,200,.09)}
.stat .k b{display:block;font-size:19px;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k span{font-size:11px;color:var(--t3)}

/* 动画 */
@keyframes pop{0%{transform:scale(.92) translateY(-8px);opacity:0}65%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card.anim-in .face{animation:pop .4s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes slideOut{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(26px) scale(.9)}}
.card.anim-out{animation:slideOut .32s ease forwards}

/* 浮窗 */
.mask{position:fixed;inset:0;background:rgba(10,7,4,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:22px;border-radius:20px;
  background:linear-gradient(180deg,rgba(45,33,22,.96),rgba(34,25,17,.96));
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border:1px solid rgba(255,235,200,.16);box-shadow:0 30px 70px -20px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,244,224,.14)}
.modal h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal h3 .x{margin-left:auto;width:30px;height:30px;border:none;border-radius:9px;background:rgba(255,244,224,.07);color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:17px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--t3);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,235,200,.16);background:rgba(255,244,224,.05);color:var(--t1);font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:rgba(255,184,77,.5)}
.field select option{background:#241A11}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.tt-grid{display:grid;grid-template-columns:34px repeat(7,1fr);gap:3px}
.tt-cell{aspect-ratio:1/.8;border:1px solid rgba(255,235,200,.12);border-radius:5px;font-size:9.5px;color:var(--t2);line-height:1.2;overflow:hidden;cursor:pointer;background:rgba(255,244,224,.03);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.tt-cell:hover{background:rgba(255,184,77,.14);border-color:rgba(255,184,77,.4)}
.tt-cell.hd{border:none;background:none;color:var(--t3);font-size:11px;cursor:default}
.tt-cell input{width:100%;height:100%;background:rgba(255,244,224,.08);border:none;border-radius:4px;color:var(--t1);font-size:10px;text-align:center}

.tabs{display:none}
footer{margin-top:14px;text-align:center;font-size:11.5px;color:var(--t3)}

@media (max-width:1000px){
  .main{grid-template-columns:1fr}
  .kb{grid-template-columns:1fr}
  .side{position:static}
  .wrap{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:rgba(28,20,12,.9);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-top:1px solid rgba(255,235,200,.12)}
  .tabs button{flex:1;min-height:50px;border:none;background:none;color:var(--t3);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px}
  .tabs button svg{width:18px;height:18px}
  .tabs button.on{color:var(--acc);background:rgba(255,184,77,.12)}
  .col.hide-m{display:none}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-layer"></div>

<div class="wrap">
<header class="glass">
  <div class="brand"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>星之间 · 看板流</div>
  <span class="cd-pill">距考研初试 <b id="cdDays">--</b> 天</span>
  <div class="acts">
    <button class="btn primary" onclick="openNew()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新卡片</button>
    <button class="btn" onclick="openTT()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 4v6M16 4v6"/></svg>课程表</button>
    <button class="btn" onclick="exportJSON()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>导出</button>
    <button class="btn" onclick="document.getElementById('impFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M4 21h16"/></svg>导入</button>
    <input type="file" id="impFile" accept="application/json" style="display:none" onchange="importJSON(this)">
  </div>
</header>

<div class="filters glass">
  <span class="lb">模块</span>
  <button class="on" data-f="all">全部</button>
  <button data-f="kaoyan"><span class="dot" style="background:var(--m-kaoyan)"></span>考研备考</button>
  <button data-f="course"><span class="dot" style="background:var(--m-course)"></span>学期科目</button>
  <button data-f="todo"><span class="dot" style="background:var(--m-todo)"></span>待办</button>
  <button data-f="life"><span class="dot" style="background:var(--m-life)"></span>生活事项</button>
</div>

<div class="main">
  <div class="kb" id="kb">
    <section class="col" data-col="inbox"><h3><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 10l4 3 5-5 4 3 5-4"/></svg>收件箱 <span class="n" id="n-inbox"></span></h3><div class="cards" id="c-inbox"></div><button class="add" onclick="openNew('inbox')">+</button></section>
    <section class="col" data-col="today"><h3><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.2 6.8.9-5 4.7 1.3 6.7L12 17.8 5.9 20.5l1.3-6.7-5-4.7 6.8-.9z"/></svg>今日要办 <span class="n" id="n-today"></span></h3><div class="cards" id="c-today"></div><button class="add" onclick="openNew('today')">+</button></section>
    <section class="col" data-col="doing"><h3><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>进行中 <span class="n" id="n-doing"></span></h3><div class="cards" id="c-doing"></div><button class="add" onclick="openNew('doing')">+</button></section>
    <section class="col" data-col="done"><h3><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>已完成 <span class="n" id="n-done"></span></h3><div class="cards" id="c-done"></div></section>
  </div>

  <aside class="side">
    <div class="boxx glass">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>日常作息</h3>
      <div id="schedList"></div>
      <button class="btn" style="width:100%;margin-top:9px;justify-content:center" onclick="addSched()">+ 加一段</button>
    </div>
    <div class="boxx glass">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M9 19v-8M14 19V9M19 19v-5"/></svg>今日概览</h3>
      <div class="stat">
        <div class="k"><b id="s-today">0</b><span>今日要办</span></div>
        <div class="k"><b id="s-doing">0</b><span>进行中</span></div>
        <div class="k"><b id="s-done">0</b><span>已完成</span></div>
        <div class="k"><b id="s-over">0</b><span>逾期</span></div>
      </div>
    </div>
  </aside>
</div>

<footer>星之间 · 方案 C 看板流｜浑象（None）出品 · 状态是骨架：拖动流转 · 翻面记笔记</footer>
</div>

<nav class="tabs" id="mtabs">
  <button class="on" data-v="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>全部</button>
  <button data-v="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 10l4 3 5-5 4 3 5-4"/></svg>收件</button>
  <button data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.2 6.8.9-5 4.7 1.3 6.7L12 17.8 5.9 20.5l1.3-6.7-5-4.7 6.8-.9z"/></svg>今日</button>
  <button data-v="doing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>进行</button>
  <button data-v="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>完成</button>
</nav>

<div class="mask" id="mNew">
  <div class="modal">
    <h3>新卡片<button class="x" onclick="closeMask('mNew')">×</button></h3>
    <div class="field"><label>要做什么</label><textarea id="nTitle" rows="2" placeholder="例：英语真题精讲一套（2019 阅读）"></textarea></div>

      <div class="field"><label>模块</label><select id="nMod"><option value="kaoyan">考研备考</option><option value="course">学期科目</option><option value="todo">待办</option><option value="life">生活事项</option></select></div>
      <div class="field"><label>放到哪列</label><select id="nCol"><option value="inbox">收件箱</option><option value="today">今日要办</option><option value="doing">进行中</option><option value="done">已完成</option></select></div>
    </div>
    <div class="field"><label>截止日期（可选）</label><input type="date" id="nDue"></div>

  </div>
</div>

<div class="mask" id="mTT">
  <div class="modal" style="max-width:660px">
    <h3>课程表 · 点格子填写<button class="x" onclick="closeMask('mTT')">×</button></h3>
    <div class="tt-grid" id="ttGrid"></div>
    <div class="foot"><button class="btn" onclick="closeMask('mTT')">关掉</button></div>
  </div>
</div>

<script>
/* ================= 数据层 ================= */
var LS='wb_xzj_board_v1';
var DAYS=['一','二','三','四','五','六','日'];
var DAYKEY=['mon','tue','wed','thu','fri','sat','sun'];
var COLS=['inbox','today','doing','done'];
var COLNAME={inbox:'收件箱',today:'今日要办',doing:'进行中',done:'已完成'};
var MODNAME={kaoyan:'考研',course:'科目',todo:'待办',life:'生活'};
var filter='all';
var state=null;

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function isoOffset(d){var t=new Date();t.setDate(t.getDate()+d);return t.toISOString().slice(0,10)}
function todayISO(){return new Date().toISOString().slice(0,10)}

function defaultState(){
  return {
    v:1,settings:{examDate:'2026-12-19'},
    cards:[
      {id:uid(),title:'英语真题精讲一套（2019 阅读）',mod:'kaoyan',col:'today',due:isoOffset(-2),note:'',createdAt:Date.now()},
      {id:uid(),title:'高数每日一练 · 定积分专题',mod:'kaoyan',col:'today',due:isoOffset(0),note:'重点：换元积分、分部积分',createdAt:Date.now()},
      {id:uid(),title:'操作系统论文查重并提交',mod:'course',col:'doing',due:isoOffset(1),note:'查重率要低于 15%',createdAt:Date.now(),startedAt:Date.now()-3600000},
      {id:uid(),title:'图书馆还书（三本）',mod:'todo',col:'inbox',due:isoOffset(4),note:'',createdAt:Date.now()},
      {id:uid(),title:'给爸妈打电话',mod:'life',col:'inbox',due:isoOffset(0),note:'',createdAt:Date.now()},
      {id:uid(),title:'打印真题卷',mod:'todo',col:'done',due:'',note:'',createdAt:Date.now(),doneAt:Date.now()}
    ],
    schedule:[
      {id:uid(),time:'07:00',label:'起床 + 早饭'},
      {id:uid(),time:'08:30',label:'自习 · 数学'},
      {id:uid(),time:'12:00',label:'午饭 + 午休'},
      {id:uid(),time:'19:00',label:'自习 · 英语 + 政治'},
      {id:uid(),time:'23:00',label:'洗漱 · 睡觉'}
    ],
    timetable:{'mon-1':'高等数学 A','mon-3':'数据结构','tue-1':'大学英语 III','tue-3':'操作系统','wed-1':'高等数学 A','thu-3':'数据结构','fri-1':'大学英语 III'}
  };
}
function load(){
  try{var raw=localStorage.getItem(LS);state=raw?JSON.parse(raw):defaultState();}
  catch(e){state=defaultState();}
  if(!state.cards)state.cards=[];
  if(!state.schedule)state.schedule=[];
  if(!state.timetable)state.timetable={};
  if(!state.settings)state.settings={examDate:'2026-12-19'};
  save();
}
function save(){localStorage.setItem(LS,JSON.stringify(state));}

/* ================= 计算层 ================= */
function daysLeft(){var d=new Date(state.settings.examDate+'T00:00:00');var n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.round((d-n)/86400000))}
function visible(){return state.cards.filter(function(c){return filter==='all'||c.mod===filter})}
function inCol(col){return visible().filter(function(c){return c.col===col})}
function isOverdue(c){return c.due&&c.col!=='done'&&c.due<todayISO()}
function dueLabel(c){
  if(!c.due)return null;
  var t=new Date(todayISO()+'T00:00:00'),d=new Date(c.due+'T00:00:00');
  var diff=Math.round((d-t)/86400000);
  if(diff<0)return {txt:'逾期 '+(-diff)+' 天',cls:'over'};
  if(diff===0)return {txt:'今天',cls:'soon'};
  if(diff===1)return {txt:'明天',cls:'soon'};
  if(diff<=3)return {txt:diff+' 天后',cls:'soon'};
  return {txt:c.due.slice(5).replace('-','/'),cls:''};
}
function durText(ms){var m=Math.round(ms/60000);if(m<60)return m+'分';return Math.floor(m/60)+'时'+(m%60)+'分'}

/* ================= 渲染层（只被 refreshAll 调用） ================= */
function renderHead(){
  document.getElementById('cdDays').textContent=daysLeft();
  document.getElementById('s-today').textContent=inCol('today').length;
  document.getElementById('s-doing').textContent=inCol('doing').length;
  document.getElementById('s-done').textContent=state.cards.filter(function(c){return c.col==='done'&&c.doneAt&&new Date(c.doneAt).toISOString().slice(0,10)===todayISO()}).length;
  document.getElementById('s-over').textContent=state.cards.filter(isOverdue).length;
}
function renderCards(){
  COLS.forEach(function(col){
    var box=document.getElementById('c-'+col);box.innerHTML='';
    var list=inCol(col);
    document.getElementById('n-'+col).textContent=list.length;
    if(!list.length&&col!=='inbox'){
      var eh=document.createElement('div');
      eh.style.cssText='font-size:12px;color:var(--t3);text-align:center;padding:16px 6px';
      eh.textContent='拖卡片过来';
      box.appendChild(eh);
    }
    list.forEach(function(c){
      var el=document.createElement('div');
      el.className='card'+(c.col==='done'?' done':'');
      el.style.setProperty('--mc','var(--m-'+c.mod+')');
      el.draggable=true;el.dataset.id=c.id;
      var inner=document.createElement('div');inner.className='card-in';

      /* 正面 */
      var front=document.createElement('div');front.className='face front';
      var bar=document.createElement('div');bar.className='bar';front.appendChild(bar);
      var t=document.createElement('div');t.className='t';t.textContent=c.title;
      t.onclick=function(){el.classList.toggle('flip')};
      front.appendChild(t);
      var m=document.createElement('div');m.className='m';
      var dl=dueLabel(c);
      if(dl){var s1=document.createElement('span');s1.className=dl.cls;s1.textContent=dl.txt;m.appendChild(s1);}
      var s2=document.createElement('span');s2.textContent='· '+MODNAME[c.mod];m.appendChild(s2);
      if(c.col==='doing'&&c.startedAt){var s3=document.createElement('span');s3.textContent='· 已进行 '+durText(Date.now()-c.startedAt);m.appendChild(s3);}
      if(c.note){var s4=document.createElement('span');s4.textContent='· 有笔记';m.appendChild(s4);}
      front.appendChild(m);
      var ops=document.createElement('div');ops.className='ops';
      var bFlip=document.createElement('button');bFlip.title='翻面看/写笔记';bFlip.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>';
      bFlip.onclick=function(ev){ev.stopPropagation();el.classList.toggle('flip')};
      var idx=COLS.indexOf(col);
      var bL=document.createElement('button');bL.className='mv';bL.title='移到上一列';bL.textContent='‹';bL.disabled=idx===0;
      bL.onclick=function(ev){ev.stopPropagation();move(c.id,-1)};
      var bR=document.createElement('button');bR.title='移到下一列';bR.textContent='›';bR.disabled=idx===COLS.length-1;
      bR.onclick=function(ev){ev.stopPropagation();move(c.id,1)};
      var bX=document.createElement('button');bX.title='删掉';bX.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      bX.onclick=function(ev){ev.stopPropagation();del(c.id)};
      [bFlip,bL,bR,bX].forEach(function(b){if(b.disabled)b.style.opacity=.3;ops.appendChild(b)});
      front.appendChild(ops);

      /* 背面（笔记） */
      var back=document.createElement('div');back.className='face back';
      var ta=document.createElement('textarea');ta.placeholder='写点笔记 / 备注…';ta.value=c.note||'';
      ta.oninput=function(){c.note=ta.value;save();};
      var bk=document.createElement('div');bk.className='bk';
      var bSave=document.createElement('button');bSave.textContent='翻回正面';bSave.onclick=function(){save();el.classList.remove('flip');refreshAll();};
      var bDel=document.createElement('button');bDel.textContent='清空笔记';bDel.onclick=function(){c.note='';save();refreshAll();};
      bk.appendChild(bSave);bk.appendChild(bDel);
      back.appendChild(ta);back.appendChild(bk);

      inner.appendChild(front);inner.appendChild(back);
      el.appendChild(inner);
      el.ondragstart=function(e){e.dataTransfer.setData('text/plain',c.id);setTimeout(function(){el.classList.add('ghost')},0)};
      el.ondragend=function(){el.classList.remove('ghost')};
      box.appendChild(el);
    });
  });
}
function renderSched(){
  var box=document.getElementById('schedList');box.innerHTML='';
  state.schedule.sort(function(a,b){return a.time.localeCompare(b.time)});
  state.schedule.forEach(function(s){
    var row=document.createElement('div');row.className='srow';
    var tm=document.createElement('span');tm.className='tm';tm.textContent=s.time;
    var lb=document.createElement('span');lb.className='lb';lb.textContent=s.label;
    var del=document.createElement('button');del.className='del';
    del.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.onclick=function(){state.schedule=state.schedule.filter(function(x){return x.id!==s.id});save();refreshAll();};
    tm.onclick=function(){editSched(s,'time',tm)};
    lb.onclick=function(){editSched(s,'label',lb)};
    row.appendChild(tm);row.appendChild(lb);row.appendChild(del);
    box.appendChild(row);
  });
}
function editSched(s,key,el){
  var inp=document.createElement('input');
  inp.value=s[key];inp.type=(key==='time'?'time':'text');
  inp.style.cssText='flex:1;padding:3px 6px;border-radius:6px;border:1px solid rgba(255,235,200,.2);background:rgba(255,244,224,.06);color:var(--t1);font-size:13px';
  el.replaceWith(inp);inp.focus();
  var commit=function(){s[key]=inp.value.trim()||s[key];save();refreshAll();};
  inp.onblur=commit;inp.onkeydown=function(e){if(e.key==='Enter')commit();if(e.key==='Escape')refreshAll();};
}
function renderTT(){
  var g=document.getElementById('ttGrid');g.innerHTML='';
  var c0=document.createElement('div');c0.className='tt-cell hd';g.appendChild(c0);
  DAYS.forEach(function(d){var c=document.createElement('div');c.className='tt-cell hd';c.textContent=d;g.appendChild(c)});
  for(var s=1;s<=10;s++){
    var h=document.createElement('div');h.className='tt-cell hd';h.textContent=s;g.appendChild(h);
    DAYKEY.forEach(function(dk){
      var key=dk+'-'+s;
      var c=document.createElement('div');c.className='tt-cell';
      var v=state.timetable[key];
      c.innerHTML=v?'<span>'+esc(v)+'</span>':'';
      c.onclick=function(){
        if(c.querySelector('input'))return;
        c.innerHTML='';
        var inp=document.createElement('input');inp.value=v||'';c.appendChild(inp);inp.focus();
        var commit=function(){var val=inp.value.trim();if(val)state.timetable[key]=val;else delete state.timetable[key];save();refreshAll();};
        inp.onblur=commit;inp.onkeydown=function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')refreshAll();};
      };
      g.appendChild(c);
    });
  }
}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function refreshAll(){renderHead();renderCards();renderSched();renderTT();}

/* ================= 行为层 ================= */
function move(id,dir){
  var c=state.cards.filter(function(x){return x.id===id})[0];if(!c)return;
  var i=COLS.indexOf(c.col)+dir;
  if(i<0||i>=COLS.length)return;
  var to=COLS[i];
  if(to==='doing'&&!c.startedAt)c.startedAt=Date.now();
  if(to==='done'&&!c.doneAt)c.doneAt=Date.now();
  if(c.col==='done'&&to!=='done')c.doneAt=null;
  if(c.col==='doing'&&to!=='doing')c.startedAt=null;
  c.col=to;save();refreshAll();
}
function setCol(id,col,el){
  var c=state.cards.filter(function(x){return x.id===id})[0];if(!c||c.col===col)return;
  if(col==='doing'&&!c.startedAt)c.startedAt=Date.now();
  if(col==='done'){c.doneAt=Date.now();if(el){el.classList.add('anim-out');}}
  if(c.col==='done'&&col!=='done')c.doneAt=null;
  if(c.col==='doing'&&col!=='doing')c.startedAt=null;
  c.col=col;save();
  if(col==='done'&&el){setTimeout(refreshAll,300);}else{refreshAll();}
}
function del(id){
  if(!confirm('删掉这张卡片？'))return;
  state.cards=state.cards.filter(function(x){return x.id!==id});save();refreshAll();
}
function addSched(){state.schedule.push({id:uid(),time:'12:00',label:'新安排'});save();refreshAll();}
function openNew(col){
  document.getElementById('nTitle').value='';
  document.getElementById('nDue').value='';
  document.getElementById('nCol').value=col||'inbox';
  openMask('mNew');
  setTimeout(function(){document.getElementById('nTitle').focus()},80);
}
function addCard(){
  var t=document.getElementById('nTitle').value.trim();
  if(!t){alert('写点什么吧');return;}
  var col=document.getElementById('nCol').value;
  state.cards.push({id:uid(),title:t,mod:document.getElementById('nMod').value,col:col,
    due:document.getElementById('nDue').value||'',note:'',createdAt:Date.now(),
    startedAt:col==='doing'?Date.now():null,doneAt:col==='done'?Date.now():null});
  save();closeMask('mNew');refreshAll();
  var box=document.getElementById('c-'+col);
  var last=box.lastElementChild;
  if(last&&last.classList.contains('card'))last.classList.add('anim-in');
}
function openMask(id){document.getElementById(id).classList.add('on')}
function closeMask(id){document.getElementById(id).classList.remove('on')}
function openTT(){openMask('mTT')}
function exportJSON(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='星之间-看板流-'+todayISO()+'.json';a.click();
}
function importJSON(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!d.cards)throw 0;
      if(!confirm('导入会覆盖当前全部数据，确定？'))return;
      state=d;
      if(!state.schedule)state.schedule=[];if(!state.timetable)state.timetable={};
      if(!state.settings)state.settings={examDate:'2026-12-19'};
      save();refreshAll();alert('导入成功');
    }catch(e){alert('文件格式不对');}
    inp.value='';
  };
  r.readAsText(f);
}

/* ================= 拖放流转 ================= */
COLS.forEach(function(col){
  var z=document.querySelector('.col[data-col="'+col+'"]');
  z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('dragover')});
  z.addEventListener('dragleave',function(){z.classList.remove('dragover')});
  z.addEventListener('drop',function(e){
    e.preventDefault();z.classList.remove('dragover');
    var id=e.dataTransfer.getData('text/plain');
    var el=document.querySelector('.card[data-id="'+id+'"]');
    setCol(id,col,el);
  });
});

/* ================= 筛选 + 移动端 Tab ================= */
document.querySelector('.filters').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.filters button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');filter=b.dataset.f;refreshAll();
});
document.getElementById('mtabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#mtabs button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');
  var v=b.dataset.v;
  COLS.forEach(function(col){
    document.querySelector('.col[data-col="'+col+'"]').classList.toggle('hide-m',!(v==='all'||v===col));
  });
});

/* ================= 启动 ================= */
document.addEventListener('DOMContentLoaded',function(){
  load();refreshAll();
  document.querySelectorAll('.mask').forEach(function(m){
    m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('on')});
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.mask').forEach(function(m){m.classList.remove('on')})});
});
</script>
</body>
