<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星之间 · 便签墙（至上主义 Suprematism）</title>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<style>
/* =========================================================
   至上主义 Suprematism · 材质皮肤
   马列维奇 1915《黑色方块》：纯粹感觉至上，纯几何色块悬浮于
   空无一物的纯色场，绝对抽象、无物象、无分割网格、动态对角
   线平衡、大量留白。平涂色场（flat unmodulated），硬边直角，
   无圆角、无立体感、无大渐变。与花窗玻璃（有铅条网格+透光）
   和软木/金属（有纹理）本质区别。
   ========================================================= */
:root{
  --sup-white:#F4F1EA;   /* 纯白基底 */
  --sup-black:#111111;   /* 墨黑：动态线/描边/大字 */
  --sup-red:#D0342C;     /* 绯红 */
  --sup-blue:#1F3A93;    /* 深蓝 */
  --sup-yellow:#F2C230;  /* 金黄 */
  --sup-green:#2E7D4F;   /* 翡翠绿 */
  --t1:#111111;--t2:#3d3d3d;--t3:#8a867e;
  --danger:#D0342C;--danger-lt:#b52a23;--warn:#c27f00;
  --maskbg:rgba(17,17,17,.42);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  background:var(--sup-white);color:#111111;min-height:100vh;overflow-x:hidden;line-height:1.55;font-size:15px}
/* ---- 页面基底 = 无垠空间：平涂纯白，极淡纸感不喧宾夺主 ---- */
.bg-layer{position:fixed;inset:0;z-index:-2;pointer-events:none;background:#FFFFFF}
.bg-layer::before{content:"";position:absolute;inset:0;filter:url(#grain);opacity:.05;pointer-events:none}

/* ---- 悬浮几何装饰层（至上主义核心：色块漂浮于空 + 动态黑斜线） ---- */
.deco{position:fixed;z-index:-1;pointer-events:none;display:block}
.d-red{width:118px;height:118px;background:var(--sup-red);top:-40px;left:-34px;transform:rotate(8deg)}
.d-blue{width:76px;height:220px;background:var(--sup-blue);right:70px;top:-56px;transform:rotate(12deg)}
.d-yellow{width:56px;height:56px;background:var(--sup-yellow);right:196px;bottom:84px;transform:rotate(-7deg)}
.d-green{width:15px;height:300px;background:var(--sup-green);left:96px;bottom:-120px;transform:rotate(70deg)}
.d-black{width:96px;height:96px;background:var(--sup-black);right:-26px;bottom:200px;transform:rotate(10deg)}
.d-cross{width:120px;height:120px;background:
  linear-gradient(var(--sup-black),var(--sup-black)) center/100% 14px no-repeat,
  linear-gradient(var(--sup-black),var(--sup-black)) center/14px 100% no-repeat;
  top:120px;right:38px;transform:rotate(26deg);opacity:.92}
.d-line-a{width:120px;height:3px;background:#111111;top:96px;left:24px;transform:rotate(16deg)}
.d-line-b{width:86px;height:3px;background:#111111;bottom:52px;right:60px;transform:rotate(38deg)}
/* 花窗版是铅条网格，至上主义版是独立斜线——动态对角线张力 */

.glass{background:#FFFFFF;border-radius:0;border:2px solid #111111;
  box-shadow:8px 8px 0 0 rgba(17,17,17,.14)}
.wrap{max-width:1280px;margin:0 auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}

/* ===== 顶栏：黑粗边框白卡 + 墨黑粗体大字 + 倒计时红方块点缀 ===== */
header{display:flex;align-items:center;gap:10px;padding:12px 18px;margin-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:900;letter-spacing:-.03em;color:#111111}
.brand svg{width:20px;height:20px;color:var(--sup-red)}
.cd-pill{display:flex;align-items:center;gap:7px;font-size:13px;color:#111111;padding:4px 2px 4px 10px;border-left:2px solid #111111}
.cd-pill::before{content:"";width:9px;height:9px;background:var(--sup-red)}
.cd-pill b{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--sup-red)}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:2px solid #111111;
  border-radius:0;font-size:13px;font-weight:700;background:#FFFFFF;color:#111111;transition:all .12s}
.btn:hover{background:#111111;color:#FFFFFF}
.btn svg{width:15px;height:15px}
.btn.primary{background:#111111;color:#FFFFFF}
.btn.primary:hover{background:var(--sup-red);border-color:var(--sup-red)}
.btn.danger{background:#FFFFFF;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#FFFFFF;border-color:var(--danger)}
.btn .badge{background:#111111;color:#FFFFFF;border-radius:0;padding:0 7px;font-size:11px;font-variant-numeric:tabular-nums}
.btn.primary .badge{background:var(--sup-red);color:#fff}

/* ===== 主区：左作息 + 右便签墙 ===== */
.main{display:grid;grid-template-columns:246px 1fr;gap:12px;align-items:start}
/* 作息表 = 白底 + 黑粗边框 + 内部黑线几何分割 */
.sched{padding:16px 15px;position:sticky;top:14px;overflow:hidden}
.sched::before{content:"";position:absolute;top:-2px;right:30%;width:2px;height:100%;background:#111111;opacity:.14;transform:rotate(28deg)}
.sched h3{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:900;color:#111111;letter-spacing:.02em;margin-bottom:11px}
.sched h3 svg{color:var(--sup-red);width:15px;height:15px}
.sched h3 .add{margin-left:auto;width:26px;height:26px;border:2px solid #111111;border-radius:0;background:#111111;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.sched h3 .add:hover{background:var(--sup-yellow);border-color:var(--sup-black);color:#111111}
.srow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid rgba(17,17,17,.18)}
.srow:last-child{border-bottom:none}
.srow .tm{font-size:12px;font-weight:700;color:var(--sup-blue);width:42px;flex:none;font-variant-numeric:tabular-nums;cursor:pointer;padding:2px 0}
.srow .lb{flex:1;font-size:13px;color:#111111;cursor:pointer;padding:2px 0;border-radius:0}
.srow .lb:hover{color:var(--sup-red);background:rgba(17,17,17,.04)}
.srow .del{width:22px;height:22px;flex:none;border:none;background:none;color:#9a968c;opacity:0;display:flex;align-items:center;justify-content:center}
.srow:hover .del{opacity:1}
.srow .del:hover{color:var(--danger)}
.srow input{flex:1;background:#fff;border:2px solid #111111;border-radius:0;color:#111111;padding:3px 7px;font-size:13px;min-width:0}
.sched .hint{margin-top:10px;font-size:11px;color:#8a867e;line-height:1.5}

/* ===== 便签墙 = 悬浮几何区：白场上叠加红方块+蓝长方+金黄斜切的几何拼块 ===== */
.board{background:#FFFFFF;border:2px solid #111111;padding:14px;position:relative;overflow:hidden}
/* 红方块 + 蓝长方拼贴 + 金黄斜切（conic 几何拼接），整体被大块留白包裹 */
.board::before{content:"";position:absolute;top:0;left:0;width:84px;height:84px;background:var(--sup-red);z-index:0;pointer-events:none}
.board::after{content:"";position:absolute;top:20px;left:38px;width:26px;height:150px;background:var(--sup-blue);z-index:0;pointer-events:none}
.board .geo-cn{position:absolute;top:0;left:0;width:190px;height:70px;z-index:0;pointer-events:none;
  background:conic-gradient(from 180deg at 0% 0%,#F4F1EA 0 50%,rgba(242,194,48,.42) 50% 100%)}
.board .geo-y{position:absolute;bottom:10px;right:16px;width:44px;height:44px;z-index:0;pointer-events:none;background:rgba(242,194,48,.5);transform:rotate(45deg)}
.board .geo-g{position:absolute;bottom:66px;right:52px;width:110px;height:5px;z-index:0;pointer-events:none;background:var(--sup-green)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1}
/* 四分区 = 黑色细线框 + 少量色块标注（非玻璃切面、非软木、非金属） */
.zone{border:1px solid rgba(17,17,17,.32);padding:11px;min-height:172px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.55);transition:background .2s,border-color .2s}
.zone.dragover{background:rgba(242,194,48,.12);border-color:#111111}
.zh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900;color:#111111;letter-spacing:.02em;border-bottom:2px solid #111111;padding-bottom:7px}
.zh svg{width:15px;height:15px;color:var(--sup-red)}
.zh .cnt{font-size:11px;color:#8a867e;font-variant-numeric:tabular-nums;font-weight:400}
.zh .plus{margin-left:auto;width:24px;height:24px;border:2px solid #111111;border-radius:0;background:#111111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.zh .plus:hover{background:var(--sup-blue);border-color:var(--sup-black)}
.zh .tt{margin-left:auto;width:24px;height:24px;border:2px solid #111111;border-radius:0;background:#fff;color:#111111;display:flex;align-items:center;justify-content:center}
.zh .tt:hover{background:var(--sup-yellow);border-color:var(--sup-black);color:#111111}
.zh .tt svg{width:14px;height:14px;color:currentColor}
.zh .tt + .plus{margin-left:4px}
.zh .plus + .tt{margin-left:4px}

/* ===== 便签 = 纯色几何色卡（对角切：上半色块+下半白）+ 3:2 竖长卡 ===== */
.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:10px}
@media (min-width:760px){.notes{grid-template-columns:repeat(3,1fr)}}
.note{--r:calc(var(--rot,0deg)*.45);position:relative;width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;overflow:hidden;
  transform:rotate(var(--r));transition:box-shadow .2s,transform .2s;
  background:linear-gradient(133deg,#111111 0 14px,transparent 14px 100%);
  box-shadow:5px 5px 0 0 rgba(17,17,17,.16)}
/* 上半纯色块 + 下半白（45° 对角切，构成主义分块） */
.note::before{content:"";position:absolute;top:0;left:0;right:0;height:58%;background:var(--sup-blue);z-index:0}
.note.tone-morning::before{background:var(--sup-blue)}
.note.tone-day::before{background:var(--sup-red)}
.note.tone-night::before{background:var(--sup-green)}
.note:hover{box-shadow:5px 5px 0 0 rgba(17,17,17,.28),0 0 0 1px #111111;z-index:2}
.note .tx{position:relative;z-index:1;flex:1;overflow:hidden;font-size:13.5px;line-height:1.5;word-break:break-word;cursor:text;
  color:#FFFFFF;font-weight:600;padding:16px 13px 6px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.note .meta{position:relative;z-index:1;font-size:11px;color:#111111;margin-top:3px;padding:2px 13px 14px;display:flex;gap:8px;flex-wrap:wrap;font-weight:500}
.note .meta .over{color:var(--danger);font-weight:700}
.note .meta .soon{color:#c27f00;font-weight:700}
.note .tear{position:absolute;top:6px;right:5px;width:22px;height:22px;border:2px solid rgba(255,255,255,.85);border-radius:0;background:rgba(17,17,17,.15);color:#fff;display:flex;align-items:center;justify-content:center;opacity:.6;transition:all .18s;z-index:2}
.note:hover .tear{opacity:1;color:#fff}
.note .tear:hover{background:rgba(17,17,17,.5);border-color:#fff}
.note .tear svg{width:13px;height:13px}
.note[draggable="true"]{cursor:grab}
.note.empty-hint{aspect-ratio:auto;background:none;box-shadow:none;color:#8a867e;font-size:12px;text-align:center;padding:18px 8px;transform:none;display:flex;align-items:center;justify-content:center;min-height:0}
.note.empty-hint::before{display:none}
.note.empty-hint::after{display:none}

/* 课程卡（科目区顶部） */
.clist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.crow{display:flex;align-items:center;gap:8px;padding:6px 9px;background:rgba(17,17,17,.04);box-shadow:inset 3px 0 0 #111111}
.crow .nm{font-size:13px;flex:1;cursor:pointer;font-weight:600}
.crow .nm:hover{color:var(--sup-red)}
.crow .ic{width:24px;height:24px;flex:none;border:2px solid #111111;border-radius:0;background:#fff;color:#111111;display:flex;align-items:center;justify-content:center}
.crow .ic:hover{background:var(--sup-yellow);border-color:var(--sup-black);color:#111111}
.crow .ic svg{width:13px;height:13px}
.crow .cnt{font-size:11px;color:#8a867e;font-variant-numeric:tabular-nums}

/* 动画（keyframes 名不变，角度适配竖卡） */
@keyframes dropIn{0%{transform:rotate(calc(var(--r,0deg) - 5deg)) translateY(-18px) scale(.8);opacity:0}65%{transform:rotate(calc(var(--r,0deg) + 2.2deg)) scale(1.04)}100%{transform:rotate(var(--r,0deg)) scale(1);opacity:1}}
@keyframes tearOff{0%{transform:rotate(var(--r,0deg)) scale(1);opacity:1}25%{transform:rotate(calc(var(--r,0deg)*2 + 2deg)) translateY(-8px) scale(1.03);opacity:1}100%{transform:rotate(32deg) translate(60px,-22px) scale(.26);opacity:0}}
@keyframes stickBack{0%{transform:rotate(-30deg) translate(46px,-16px) scale(.34);opacity:0}60%{transform:rotate(calc(var(--r,0deg)*2 + 1.5deg)) scale(1.05);opacity:1}100%{transform:rotate(var(--r,0deg)) scale(1);opacity:1}}
.note.anim-in{animation:dropIn .48s cubic-bezier(.2,.9,.25,1.05) both}
.note.anim-tear{animation:tearOff .5s cubic-bezier(.5,0,.75,.4) forwards;pointer-events:none}
.note.anim-back{animation:stickBack .55s cubic-bezier(.2,.9,.25,1.05) both}

/* ===== 浮窗 ===== */
.mask{position:fixed;inset:0;background:rgba(17,17,17,.42);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:22px;border-radius:0;
  background:#FFFFFF;border:2px solid #111111;box-shadow:14px 14px 0 0 rgba(17,17,17,.16)}
.modal h3{font-size:16px;font-weight:900;color:#111111;margin-bottom:16px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.modal h3 .x{margin-left:auto;width:30px;height:30px;border:2px solid #111111;border-radius:0;background:#111111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.modal h3 .x:hover{background:var(--sup-red);border-color:var(--sup-red)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:#111111;margin-bottom:5px;letter-spacing:.02em}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:0;border:2px solid #111111;background:#FFFFFF;color:#111111;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sup-red);box-shadow:0 0 0 2px rgba(208,52,44,.15)}
.field select option{background:#FFFFFF;color:#111111}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* 课表格子 */
.tt-grid{display:grid;grid-template-columns:38px repeat(7,1fr);gap:3px}
.tt-cell{aspect-ratio:1/.86;border:1px solid rgba(17,17,17,.35);border-radius:0;padding:2px;font-size:10px;color:#111111;line-height:1.25;overflow:hidden;cursor:pointer;background:#FFFFFF;transition:all .15s;display:flex;align-items:center;justify-content:center;text-align:center}
.tt-cell:hover{background:rgba(242,194,48,.2);border-color:#111111}
.tt-cell.hd{border:none;background:none;color:#8a867e;font-size:11px;cursor:default;font-weight:700}
.tt-cell.hd:hover{background:none}
.tt-cell .cn{font-size:9.5px;line-height:1.2;word-break:break-all;color:var(--sup-blue);font-weight:600}
.tt-cell input{width:100%;height:100%;background:#fff;border:none;border-radius:0;color:#111111;font-size:10px;text-align:center;padding:2px}
/* 便签盒 */
.box-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.box-note{position:relative;padding:10px 12px;border-radius:0;background:#F4F1EA;box-shadow:inset 4px 0 0 var(--sup-red);border:1px solid #111111}
.box-note .tx{font-size:13px;color:#111111;font-weight:600}
.box-note .meta{font-size:11px;color:#8a867e;margin-top:4px}
.box-note .acts2{display:flex;gap:6px;margin-top:8px}
.box-note .acts2 button{flex:1;min-height:36px;border:2px solid #111111;border-radius:0;font-size:12px;font-weight:700;background:#FFFFFF;color:#111111}
.box-note .acts2 button:hover{background:#111111;color:#FFFFFF}
.box-note .acts2 button.rm{color:var(--danger);border-color:var(--danger)}
.box-note .acts2 button.rm:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.empty{text-align:center;color:#8a867e;font-size:13px;padding:24px 8px;grid-column:1/-1}

/* 移动端底部 Tab */
.tabs{display:none}
footer{margin-top:14px;text-align:center;font-size:11.5px;color:#8a867e;letter-spacing:.05em}

/* ===== 响应式 ===== */
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .zones{grid-template-columns:1fr}
  .sched{position:static}
  .wrap{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:#FFFFFF;border-top:2px solid #111111;box-shadow:0 -4px 12px -4px rgba(17,17,17,.18)}
  .tabs button{flex:1;min-height:50px;border:none;background:none;color:#8a867e;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:0}
  .tabs button svg{width:18px;height:18px}
  .tabs button.on{color:#FFFFFF;background:#111111}
  .tabs button .nb{position:absolute;transform:translate(14px,-10px);font-size:9px;background:var(--sup-red);color:#fff;border-radius:0;padding:0 5px}
  .zone.hide-m{display:none}
  .sched.hide-m{display:none}
  .board.tabs-on .zone{display:flex}
  .box-list{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- hidden SVG defs：极淡纸感 feTurbulence（平涂色场的轻微纸感，不喧宾夺主） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 1"/></feComponentTransfer>
    </filter>
  </defs>
</svg>

<!-- 悬浮几何装饰层：纯几何色块漂浮于空（红方块/蓝长方/金黄块/绿长条/黑方块/黑十字/动态斜线） -->
<span class="deco d-red"></span>
<span class="deco d-blue"></span>
<span class="deco d-yellow"></span>
<span class="deco d-green"></span>
<span class="deco d-black"></span>
<span class="deco d-cross"></span>
<span class="deco d-line-a"></span>
<span class="deco d-line-b"></span>

<div class="wrap">
<header class="glass">
  <div class="brand"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5c-.8.7-1.2 1.6-1.2 2.5h-5.6c0-.9-.4-1.8-1.2-2.5A6 6 0 0 1 12 3z"/></svg>星之间 · 便签墙</div>
  <span class="cd-pill">距考研初试 <b id="cdDays">--</b> 天</span>
  <div class="acts">
    <button class="btn primary" onclick="openNew()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>写便签</button>

<script>
/* ================= 数据层 ================= */
var LS='wb_xzj_wall_v1';
var DAYS=['一','二','三','四','五','六','日'];
var DAYKEY=['mon','tue','wed','thu','fri','sat','sun'];
var state=null;

function defaultState(){
  var t=new Date();t.setFullYear(t.getFullYear());
  return {
    v:1,
    settings:{examDate:'2026-12-19'},
    notes:[
      {id:uid(),board:'kaoyan',title:'英语真题精讲一套（2019 阅读）',due:isoOffset(-2),time:'',courseId:'',done:false,tone:'day',createdAt:Date.now()},
      {id:uid(),board:'kaoyan',title:'高数每日一练 · 定积分专题',due:isoOffset(0),time:'',courseId:'',done:false,tone:'night',createdAt:Date.now()},
      {id:uid(),board:'course',title:'操作系统论文查重并提交',due:isoOffset(1),time:'',courseId:'c4',done:false,tone:'morning',createdAt:Date.now()},
      {id:uid(),board:'todo',title:'图书馆还书（三本）',due:isoOffset(4),time:'',courseId:'',done:false,tone:'day',createdAt:Date.now()},
      {id:uid(),board:'life',title:'给爸妈打电话',due:isoOffset(0),time:'21:00',courseId:'',done:false,tone:'night',createdAt:Date.now()}
    ],
    schedule:[
      {id:uid(),time:'07:00',label:'起床 + 早饭'},
      {id:uid(),time:'08:30',label:'自习 · 数学'},
      {id:uid(),time:'12:00',label:'午饭 + 午休'},
      {id:uid(),time:'14:00',label:'上课 / 实验'},
      {id:uid(),time:'19:00',label:'自习 · 英语 + 政治'},
      {id:uid(),time:'23:00',label:'洗漱 · 睡觉'}
    ],
    courses:[
      {id:'c1',name:'高等数学 A'},{id:'c2',name:'数据结构'},
      {id:'c3',name:'大学英语 III'},{id:'c4',name:'操作系统'}
    ],
    timetable:{
      'mon-1':'高等数学 A','mon-3':'数据结构',
      'tue-1':'大学英语 III','tue-3':'操作系统',
      'wed-1':'高等数学 A','thu-3':'数据结构','fri-1':'大学英语 III'
    }
  };
}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function isoOffset(d){var t=new Date();t.setDate(t.getDate()+d);return t.toISOString().slice(0,10)}
function todayISO(){return new Date().toISOString().slice(0,10)}

function load(){
  try{
    var raw=localStorage.getItem(LS);
    if(raw){state=JSON.parse(raw);}
    else{state=defaultState();save();}
  }catch(e){state=defaultState();}
  if(!state.notes)state.notes=[];
  if(!state.schedule)state.schedule=[];
  if(!state.courses)state.courses=[];
  if(!state.timetable)state.timetable={};
  if(!state.settings)state.settings={examDate:'2026-12-19'};
}
function save(){localStorage.setItem(LS,JSON.stringify(state));}

/* ================= 计算层 ================= */
function activeNotes(){return state.notes.filter(function(n){return !n.done})}
function tornNotes(){return state.notes.filter(function(n){return n.done}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)})}
function daysLeft(){var d=new Date(state.settings.examDate+'T00:00:00');var n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.round((d-n)/86400000))}
function dueLabel(n){
  if(!n.due)return '';
  var t=new Date(todayISO()+'T00:00:00'),d=new Date(n.due+'T00:00:00');
  var diff=Math.round((d-t)/86400000);
  if(diff<0)return {txt:'逾期 '+(-diff)+' 天',cls:'over'};
  if(diff===0)return {txt:'今天'+(n.time?' '+n.time:''),cls:'soon'};
  if(diff===1)return {txt:'明天'+(n.time?' '+n.time:''),cls:'soon'};
  if(diff<=3)return {txt:diff+' 天后',cls:'soon'};
  return {txt:n.due.slice(5).replace('-','/'),cls:''};
}
function courseName(id){var c=state.courses.filter(function(x){return x.id===id})[0];return c?c.name:''}

/* ================= 渲染层（只被 refreshAll 调用，互不调用） ================= */
function renderCountdown(){document.getElementById('cdDays').textContent=daysLeft();}

function renderSched(){
  var box=document.getElementById('schedList');box.innerHTML='';
  state.schedule.sort(function(a,b){return a.time.localeCompare(b.time)});
  state.schedule.forEach(function(s){
    var row=document.createElement('div');row.className='srow';
    var tm=document.createElement('span');tm.className='tm';tm.textContent=s.time;
    var lb=document.createElement('span');lb.className='lb';lb.textContent=s.label;
    var del=document.createElement('button');del.className='del';del.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.onclick=function(){state.schedule=state.schedule.filter(function(x){return x.id!==s.id});save();refreshAll();};
    tm.onclick=function(){editSched(s,'time',tm)};
    lb.onclick=function(){editSched(s,'label',lb)};
    row.appendChild(tm);row.appendChild(lb);row.appendChild(del);
    box.appendChild(row);
  });
}
function editSched(s,key,el){
  var inp=document.createElement('input');
  inp.value=s[key];inp.type=(key==='time'?'time':'text');
  el.replaceWith(inp);inp.focus();
  var commit=function(){s[key]=inp.value.trim()||s[key];save();refreshAll();};
  inp.onblur=commit;inp.onkeydown=function(e){if(e.key==='Enter')commit();if(e.key==='Escape')refreshAll();};
}
function addSched(){
  state.schedule.push({id:uid(),time:'12:00',label:'新安排'});
  save();refreshAll();
}
function renderCourses(){
  var box=document.getElementById('courseList');box.innerHTML='';
  state.courses.forEach(function(c){
    var n=state.notes.filter(function(x){return !x.done&&x.courseId===c.id}).length;
    var row=document.createElement('div');row.className='crow';
    var nm=document.createElement('span');nm.className='nm';nm.textContent=c.name;
    nm.onclick=function(){
      var inp=document.createElement('input');
      inp.type='text';inp.maxLength=30;inp.value=c.name;
      inp.style.flex='1';inp.style.minWidth='0';inp.style.padding='4px 8px';inp.style.fontSize='13px';
      inp.style.border='1px solid rgba(255,235,200,.2)';inp.style.borderRadius='6px';
      inp.style.background='rgba(255,244,224,.08)';inp.style.color='var(--t1)';
      nm.replaceWith(inp);inp.focus();inp.select();
      var done=false;
      var commit=function(){
        if(done)return;done=true;
        var v=inp.value.trim();
        if(!v){
          if(confirm('删除课程「'+c.name+'」？它的待办便签会保留但解除关联')){
            state.courses=state.courses.filter(function(x){return x.id!==c.id});
            state.notes.forEach(function(x){if(x.courseId===c.id)x.courseId=''});
          }
        }else if(v!==c.name){c.name=v;}
        save();refreshAll();
      };
      inp.onblur=function(){commit()};
      inp.onkeydown=function(e){if(e.key==='Enter'){inp.blur();}if(e.key==='Escape'){inp.value=c.name;inp.blur();}};
    };
    var add=document.createElement('button');add.className='ic';add.title='给这门课贴待办便签';
    add.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    add.onclick=function(){openNew('course',c.id)};
    var cnt=document.createElement('span');cnt.className='cnt';cnt.textContent=n?n+' 待办':'';
    row.appendChild(nm);row.appendChild(cnt);row.appendChild(add);
    box.appendChild(row);
  });
}
function renderWall(){
  ['kaoyan','course','todo','life'].forEach(function(b){
    var box=document.getElementById('notes-'+b);
    var list=activeNotes().filter(function(n){return n.board===b});
    document.getElementById('cnt-'+b).textContent=list.length?list.length+' 张':'';
    box.innerHTML='';
    if(!list.length){
      var eh=document.createElement('div');eh.className='note empty-hint';
      eh.textContent='这面墙还空着 · 点 + 贴一张';
      box.appendChild(eh);return;
    }
    list.forEach(function(n){
      var el=document.createElement('div');
      el.className='note tone-'+(n.tone||'day');
      el.style.setProperty('--rot',((n.id.charCodeAt(0)%5)-2)*0.6+'deg');
      el.draggable=true;el.dataset.id=n.id;
      var tx=document.createElement('div');tx.className='tx';tx.textContent=n.title;
      var meta=document.createElement('div');meta.className='meta';
      var d=dueLabel(n);
      if(d){var s1=document.createElement('span');s1.className=d.cls;s1.textContent=d.txt;meta.appendChild(s1);}
      if(n.courseId){var s2=document.createElement('span');s2.textContent='· '+courseName(n.courseId);meta.appendChild(s2);}
      var tear=document.createElement('button');tear.className='tear';tear.title='撕下（完成并收进便签盒）';
      tear.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 4v6h6"/></svg>';
      tear.onclick=function(ev){ev.stopPropagation();tearNote(n.id,el);};
      el.appendChild(tx);el.appendChild(meta);el.appendChild(tear);
      el.ondragstart=function(e){e.dataTransfer.setData('text/plain',n.id);el.style.opacity=.4};
      el.ondragend=function(){el.style.opacity=1};
      box.appendChild(el);
    });
  });
}
function renderBox(){
  var list=tornNotes();
  document.getElementById('boxCnt').textContent=list.length;
  document.getElementById('boxSub').textContent=list.length?'（'+list.length+' 张，可粘回）':'（空的）';
  var box=document.getElementById('boxList');box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="empty">还没有撕下的便签——完成的事撕下来就进这儿</div>';return;}
  list.forEach(function(n){
    var el=document.createElement('div');el.className='box-note';
    var tx=document.createElement('div');tx.className='tx';tx.textContent=n.title;
    var meta=document.createElement('div');meta.className='meta';
    meta.textContent='来自「'+boardName(n.board)+'」 · 撕于 '+new Date(n.doneAt||Date.now()).toLocaleDateString('zh-CN');
    var acts=document.createElement('div');acts.className='acts2';
    var bk=document.createElement('button');bk.textContent='粘回墙上';bk.onclick=function(){restoreNote(n.id)};
    var rm=document.createElement('button');rm.className='rm';rm.textContent='彻底丢掉';
    rm.onclick=function(){state.notes=state.notes.filter(function(x){return x.id!==n.id});save();refreshAll();};
    acts.appendChild(bk);acts.appendChild(rm);
    el.appendChild(tx);el.appendChild(meta);el.appendChild(acts);
    box.appendChild(el);
  });
}
function boardName(b){return {kaoyan:'考研备考',course:'学期科目',todo:'待办',life:'生活事项'}[b]||b}

function renderTT(){
  var g=document.getElementById('ttGrid');g.innerHTML='';
  var c0=document.createElement('div');c0.className='tt-cell hd';c0.textContent='';g.appendChild(c0);
  DAYS.forEach(function(d){var c=document.createElement('div');c.className='tt-cell hd';c.textContent=d;g.appendChild(c)});
  for(var s=1;s<=10;s++){
    var h=document.createElement('div');h.className='tt-cell hd';h.textContent=s;g.appendChild(h);
    DAYKEY.forEach(function(dk){
      var key=dk+'-'+s;
      var c=document.createElement('div');c.className='tt-cell';
      var v=state.timetable[key];
      c.innerHTML=v?'<span class="cn">'+esc(v)+'</span>':'';
      c.onclick=function(){
        if(c.querySelector('input'))return;
        c.innerHTML='';
        var inp=document.createElement('input');inp.value=v||'';c.appendChild(inp);inp.focus();
        var commit=function(){
          var val=inp.value.trim();
          if(val)state.timetable[key]=val;else delete state.timetable[key];
          save();refreshAll();
        };
        inp.onblur=commit;inp.onkeydown=function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')refreshAll();};
      };
      g.appendChild(c);
    });
  }
}
function renderCourseMgr(){
  var box=document.getElementById('courseMgr');box.innerHTML='';
  state.courses.forEach(function(c){
    var row=document.createElement('div');row.className='crow';
    var nm=document.createElement('span');nm.className='nm';nm.textContent=c.name;
    nm.onclick=function(){
      var inp=document.createElement('input');
      inp.type='text';inp.maxLength=30;inp.value=c.name;
      inp.style.flex='1';inp.style.minWidth='0';inp.style.padding='4px 8px';inp.style.fontSize='13px';
      inp.style.border='1px solid rgba(255,235,200,.2)';inp.style.borderRadius='6px';
      inp.style.background='rgba(255,244,224,.08)';inp.style.color='var(--t1)';
      nm.replaceWith(inp);inp.focus();inp.select();
      var commit=function(){
        var v=inp.value.trim();
        if(v){c.name=v;save();refreshAll();}
        else{refreshAll();}
      };
      inp.onblur=function(){commit()};
      inp.onkeydown=function(e){if(e.key==='Enter'){inp.blur();}if(e.key==='Escape'){refreshAll();}};
    };
    var del=document.createElement('button');del.className='ic';del.title='删除课程';
    del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.onclick=function(){state.courses=state.courses.filter(function(x){return x.id!==c.id});state.notes.forEach(function(x){if(x.courseId===c.id)x.courseId=''});save();refreshAll();};
    row.appendChild(nm);row.appendChild(del);box.appendChild(row);
  });
  var add=document.createElement('button');add.className='btn';add.style.marginTop='6px';add.textContent='+ 加一门课';
  add.onclick=function(){
    var inp=document.createElement('input');
    inp.type='text';inp.maxLength=30;inp.placeholder='输入课程名，回车添加';
    inp.style.marginTop='6px';inp.style.width='100%';inp.style.padding='8px 10px';
    inp.style.border='1px solid rgba(255,235,200,.2)';inp.style.borderRadius='8px';
    inp.style.background='rgba(255,244,224,.06)';inp.style.color='var(--t1)';inp.style.fontSize='14px';
    add.replaceWith(inp);inp.focus();
    var commit=function(){
      var v=inp.value.trim();
      if(v){state.courses.push({id:uid(),name:v});save();refreshAll();}
      else{refreshAll();}
    };
    inp.onblur=function(){commit()};
    inp.onkeydown=function(e){if(e.key==='Enter'){inp.blur();}if(e.key==='Escape'){refreshAll();}};
  };
  box.appendChild(add);
}
function renderCourseOptions(){
  var sel=document.getElementById('nCourse');
  var cur=sel.value;
  sel.innerHTML='<option value="">（不关联）</option>';
  state.courses.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o)});
  sel.value=cur;
}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

function refreshAll(){
  renderCountdown();renderSched();renderCourses();renderWall();renderBox();renderTT();renderCourseMgr();renderCourseOptions();
}

/* ================= 行为层（改数据 → 保存 → refreshAll） ================= */
function openNew(board,courseId){
  document.getElementById('nTitle').value='';
  document.getElementById('nBoard').value=board||'todo';
  document.getElementById('nDue').value='';
  document.getElementById('nTime').value='';
  renderCourseOptions();
  if(courseId)document.getElementById('nCourse').value=courseId;
  openMask('mNew');
  setTimeout(function(){document.getElementById('nTitle').focus()},80);
}
function addNote(){
  var t=document.getElementById('nTitle').value.trim();
  if(!t){alert('便签不能是空的');return;}
  var b=document.getElementById('nBoard').value;
  var tones=['morning','day','night'];
  state.notes.push({
    id:uid(),board:b,title:t,due:document.getElementById('nDue').value,
    time:document.getElementById('nTime').value,courseId:document.getElementById('nCourse').value,
    done:false,tone:tones[Math.floor(Math.random()*3)],createdAt:Date.now()
  });
  save();closeMask('mNew');refreshAll();
  // 落贴动画
  var zone=document.getElementById('notes-'+b);
  var last=zone.lastElementChild;
  if(last){last.classList.add('anim-in');}
}
function tearNote(id,el){
  el.classList.add('anim-tear');
  setTimeout(function(){
    var n=state.notes.filter(function(x){return x.id===id})[0];
    if(n){n.done=true;n.doneAt=Date.now();}
    save();refreshAll();
  },480);
}
function restoreNote(id){
  var n=state.notes.filter(function(x){return x.id===id})[0];
  if(!n)return;
  n.done=false;n.doneAt=null;
  save();closeMask('mBox');refreshAll();
  var zone=document.getElementById('notes-'+n.board);
  var els=zone.querySelectorAll('.note');
  for(var i=0;i<els.length;i++){
    if(els[i].dataset.id===id){els[i].classList.add('anim-back');break;}
  }
}
function clearBox(){
  if(!confirm('清空便签盒？撕下的便签会彻底丢掉（不可恢复）。'))return;
  state.notes=state.notes.filter(function(n){return !n.done});
  save();refreshAll();
}
function openMask(id){document.getElementById(id).classList.add('on')}
function closeMask(id){document.getElementById(id).classList.remove('on')}
function openTT(){openMask('mTT')}
function openBox(){openMask('mBox')}
function exportJSON(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='星之间-便签墙-'+todayISO()+'.json';a.click();
}
function importJSON(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!d.notes)throw 0;
      if(!confirm('导入会覆盖当前全部数据，确定？'))return;
      state=d;
      if(!state.notes)state.notes=[];
      if(!state.schedule)state.schedule=[];
      if(!state.courses)state.courses=[];
      if(!state.timetable)state.timetable={};
      if(!state.settings)state.settings={examDate:'2026-12-19'};
      save();refreshAll();alert('导入成功');
    }catch(e){alert('文件格式不对');}
    inp.value='';
  };
  r.readAsText(f);
}

/* ================= 拖放（桌面：便签换墙） ================= */
['kaoyan','course','todo','life'].forEach(function(b){
  var z=document.getElementById(b==='kaoyan'?'zone-kaoyan':'zone-'+b);
  z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('dragover')});
  z.addEventListener('dragleave',function(){z.classList.remove('dragover')});
  z.addEventListener('drop',function(e){
    e.preventDefault();z.classList.remove('dragover');
    var id=e.dataTransfer.getData('text/plain');
    var n=state.notes.filter(function(x){return x.id===id})[0];
    if(n&&n.board!==b){n.board=b;save();refreshAll();}
  });
});

/* ================= 移动端 Tab ================= */
document.getElementById('mtabs').addEventListener('click',function(e){
  var btn=e.target.closest('button');if(!btn)return;
  var v=btn.dataset.v;
  if(v==='box'){openBox();return;}   // 便签盒是浮窗，不常驻 Tab 高亮
  document.querySelectorAll('#mtabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  var sched=document.getElementById('schedCard');
  closeMask('mBox');
  ['kaoyan','course','todo','life'].forEach(function(b){
    document.getElementById('zone-'+b).style.display=(v==='all'||v===b)?'':'none';
  });
  sched.style.display=(v==='all')?'':'none';
});

/* ================= 启动 ================= */
document.addEventListener('DOMContentLoaded',function(){
  load();
  refreshAll();
  document.querySelectorAll('.mask').forEach(function(m){
    m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('on')});
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.mask').forEach(function(m){m.classList.remove('on')})});
});
</script>
</body>
