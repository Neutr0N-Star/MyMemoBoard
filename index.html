<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星之间 · 便签墙（构成主义 · 工程设计流）</title>
<style>
/* ========== tokens · 构成主义 / 工程设计流 ========== */
:root{
  --paper:#F2EFE6;              /* 蓝图底稿纸 */
  --grid:rgba(30,30,30,.08);    /* 结构网格线 */
  --ink:#17171A;                /* 结构墨黑 */
  --red:#D0342C;                /* 功能红：行动/警示 */
  --white:#FFFFFF;              /* 留白 */
  --blue:#3E5C76;               /* 钢蓝：小面积点缀 */
  --tick:#17171A;               /* 机械线/刻度 */
  --fd:"Arial Black","Arial Bold","Impact","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.5;font-size:15px;font-weight:500}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}

/* ===== 蓝图底稿纸背景：米白纸底 + 毫米结构网格 ===== */
.bg-layer{position:fixed;inset:0;z-index:-3;pointer-events:none;background-color:var(--paper);
  background-image:
    radial-gradient(58vw 46vh at 78% -4%, rgba(62,92,118,.07), transparent 62%),
    radial-gradient(42vw 40vh at 4% 96%, rgba(23,23,26,.05), transparent 60%),
    repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 22px),
    repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 22px);
  background-size:auto,auto,22px 22px,22px 22px}
.papertex{position:fixed;inset:0;z-index:-2;pointer-events:none;filter:url(#paperNoise);opacity:.5;mix-blend-mode:multiply}

/* ===== 图纸角标 / 十字准星 / 侧刻度尺 / 标题栏 ===== */
.regmarks{position:fixed;inset:0;z-index:-1;pointer-events:none;color:var(--ink)}
.cr{position:absolute;width:18px;height:18px;opacity:.55}
.c-tl{top:14px;left:14px;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.c-tr{top:14px;right:14px;border-top:2px solid var(--ink);border-right:2px solid var(--ink)}
.c-bl{bottom:14px;left:14px;border-bottom:2px solid var(--ink);border-left:2px solid var(--ink)}
.c-br{bottom:14px;right:14px;border-bottom:2px solid var(--ink);border-right:2px solid var(--ink)}
.ruler-r{position:absolute;top:8%;right:8px;bottom:16%;width:12px;background:repeating-linear-gradient(180deg,var(--tick) 0 1px,transparent 1px 5px);opacity:.3}
.titleblock{position:absolute;right:18px;bottom:10px;width:168px;border:1.5px solid var(--ink);background:var(--paper);padding:6px 8px;display:flex;flex-direction:column;gap:1px;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.titleblock b{display:block;font-size:10px;color:var(--red);letter-spacing:.1em;border-bottom:1px solid var(--ink);padding-bottom:3px;margin-bottom:3px}
.titleblock span{display:flex;justify-content:space-between;align-items:center}
.titleblock em{font-style:normal;color:var(--blue);letter-spacing:.12em}

.glass{background:var(--white)}

.wrap{max-width:1280px;margin:0 auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}

/* ===== 顶栏（图纸图签） ===== */
header{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap;background:var(--white);border:2px solid var(--ink);position:relative}
header::before{content:"";position:absolute;top:-2px;left:-2px;width:40px;height:9px;background:var(--red)}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:900;letter-spacing:-.02em;font-family:var(--fd);position:relative}
.brand svg{color:var(--red);width:19px;height:19px;flex:none}
.brand::after{content:"A-01";font-size:9px;font-weight:900;color:#fff;background:var(--ink);padding:2px 6px;letter-spacing:.12em;margin-left:2px}
.cd-pill{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;letter-spacing:.05em;color:var(--ink);padding:4px 10px;border:2px solid var(--ink);background:var(--white)}
.cd-pill::after{content:"";width:8px;height:8px;background:var(--red);flex:none}
.cd-pill b{font-size:25px;font-weight:900;color:#fff;background:var(--ink);padding:1px 12px;font-variant-numeric:tabular-nums;line-height:1.3}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border:2px solid var(--ink);border-radius:0;background:var(--white);color:var(--ink);font-weight:900;font-size:12px;letter-spacing:.02em;transition:box-shadow .1s,transform .1s,background .1s}
.btn:hover{box-shadow:inset 0 -3px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:inset 0 0 0 2px var(--ink)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{box-shadow:inset 0 -3px 0 var(--red)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--ink)}
.btn.danger:hover{box-shadow:inset 0 -3px 0 var(--ink)}
.btn .badge{background:var(--red);color:#fff;padding:1px 6px;font-size:10px;font-weight:900;border-radius:0}
/* ===== 主区：左作息 + 右便签墙 ===== */
.main{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}

/* ===== 作息侧栏 = 功能面板（白底黑框 + 时间刻度尺） ===== */
.sched{background:var(--white);border:2px solid var(--ink);padding:12px 14px 14px;position:sticky;top:14px;position:relative}
.sched::before{content:"";position:absolute;top:-2px;left:-2px;width:52px;height:8px;background:var(--red)}
.sched h3{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;font-family:var(--fd);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;padding-bottom:7px;border-bottom:3px solid var(--ink)}
.sched h3 svg{width:15px;height:15px;color:var(--red);flex:none}
.sched h3::before{content:"";width:10px;height:10px;background:var(--red);flex:none}
.sched h3 .add{margin-left:auto;width:26px;height:26px;border:2px solid var(--ink);border-radius:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;font-weight:900}
.sched h3 .add:active{transform:translate(1px,1px);box-shadow:inset 0 0 0 2px var(--red)}
.sched .ruler{margin:2px 0 6px;height:7px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:1px solid var(--ink);background:repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 14px),linear-gradient(90deg,#fff,#fff);box-sizing:content-box;padding:0 1px}
.srow{display:flex;align-items:center;gap:8px;padding:4px 0 5px;border-bottom:1px solid var(--ink);position:relative}
.srow:last-child{border-bottom:none}
.srow::before{content:"";position:absolute;left:-14px;top:50%;width:8px;height:1px;background:var(--ink);opacity:.7}
.srow .tm{font-size:11px;color:var(--ink);width:46px;flex:none;font-variant-numeric:tabular-nums;cursor:pointer;padding:2px 0;font-weight:700;border-left:3px solid var(--ink);padding-left:6px}
.srow .lb{flex:1;font-size:12.5px;color:var(--ink);cursor:pointer;padding:2px 4px}
.srow .lb:hover{background:var(--ink);color:#fff}
.srow .del{width:22px;height:22px;flex:none;border:1.5px solid var(--ink);border-radius:0;background:var(--white);color:var(--ink);opacity:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;line-height:1}
.srow:hover .del{opacity:1}
.srow .del:hover{background:var(--red);color:#fff}
.srow input{flex:1;background:#fff;border:1.5px solid var(--ink);border-radius:0;color:var(--ink);padding:3px 7px;font-size:13px;min-width:0}
.sched .hint{margin-top:10px;font-size:10px;color:var(--ink);font-weight:700;letter-spacing:.02em;border-top:1px dashed var(--ink);padding-top:6px}

/* ===== board = 一张工程图纸的分区（黑粗框 + 机械剖线分隔） ===== */
.board{background:var(--white);border:3px solid var(--ink);padding:14px;position:relative}
.board::before{content:"";position:absolute;top:-3px;left:-3px;width:66px;height:12px;background:var(--red);z-index:3}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:
    linear-gradient(135deg,rgba(23,23,26,.08) 0 3px,transparent 3px),
    linear-gradient(45deg,rgba(23,23,26,.06) 0 3px,transparent 3px);
  background-size:12px 12px;opacity:.4}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative;z-index:1}
.zone{border:1px dashed var(--ink);padding:11px;min-height:176px;display:flex;flex-direction:column;gap:9px;transition:background .15s;position:relative;background:rgba(255,255,255,.85)}
.zone.dragover{background:rgba(211,47,47,.07)}
.zh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;font-family:var(--fd);letter-spacing:.05em}
.zh svg{width:14px;height:14px;color:var(--ink);flex:none}
.zh .cnt{font-size:10px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--ink);padding:0 5px;letter-spacing:.03em}
.zh .plus{margin-left:auto;width:23px;height:23px;border:2px solid var(--ink);border-radius:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;font-size:14px;padding:0}
.zh .plus:active{transform:translate(1px,1px);box-shadow:inset 0 0 0 2px var(--red)}
.zh .tt{margin-left:auto;width:23px;height:23px;border:2px solid var(--ink);border-radius:0;background:var(--white);color:var(--ink);display:flex;align-items:center;justify-content:center}
.zh .tt:active{transform:translate(1px,1px);box-shadow:inset 0 0 0 2px var(--ink)}
.zh .tt+.plus{margin-left:7px}
/* ===== 便签 = 功能工单卡（白底黑框 + 红色功能块 + 左上编号） ===== */
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.note{position:relative;padding:0;transform:rotate(var(--rot,0deg));transition:box-shadow .15s,transform .15s;
  width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;overflow:hidden;will-change:transform;
  background:var(--white);border:2px solid var(--ink);box-shadow:4px 4px 0 rgba(23,23,26,.18)}
.note::before{content:"";position:absolute;top:0;left:0;width:26px;height:26px;background:var(--red);z-index:2}
.note.tone-morning::before{background:var(--red)}
.note.tone-day::before{background:var(--blue)}
.note.tone-night::before{background:var(--ink)}
.note::after{content:"";position:absolute;top:26px;left:13px;width:1.5px;height:60px;background:var(--tick);opacity:.32;z-index:1}
.note:hover{box-shadow:0 8px 18px -8px rgba(0,0,0,.4);z-index:2}
.note .tx{font-size:13.5px;line-height:1.5;word-break:break-word;cursor:text;flex:1;overflow:hidden;padding:30px 12px 8px}
.note .meta{font-size:10.5px;color:var(--ink);display:flex;gap:8px;flex-wrap:wrap;font-weight:700;padding:6px 12px 8px;border-top:2px solid var(--ink)}
.note .meta .over{background:var(--red);color:#fff;padding:0 5px;font-weight:900;letter-spacing:.02em}
.note .meta .soon{background:var(--ink);color:#fff;padding:0 5px;font-weight:900;letter-spacing:.02em}
.note .tear{position:absolute;top:7px;right:7px;width:20px;height:20px;border:2px solid var(--ink);border-radius:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;opacity:.5;transition:all .15s;padding:0}
.note:hover .tear{opacity:1}
.note .tear:hover{background:var(--red);color:#fff;box-shadow:inset 0 0 0 2px var(--white)}
.note .tear svg{width:11px;height:11px}
.note[draggable="true"]{cursor:grab}
.note.empty-hint{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);font-size:12px;font-weight:700;text-align:center;padding:16px 8px;transform:none;border:none;aspect-ratio:auto;justify-content:center}
.note.empty-hint::before,.note.empty-hint::after{display:none}
.note.empty-hint .tx{border:none;padding:0;overflow:visible;font-weight:700;color:var(--ink)}

/* ===== 课程卡（科目区顶部） ===== */
.clist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.crow{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff;border:1.5px solid var(--ink)}
.crow .nm{font-size:13px;flex:1;cursor:pointer;font-weight:700}
.crow .nm:hover{background:var(--ink);color:#fff}
.crow .ic{width:24px;height:24px;flex:none;border:1.5px solid var(--ink);border-radius:0;background:var(--white);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.crow .ic:hover{background:var(--ink);color:#fff}
.crow .ic:active{transform:translate(1px,1px);box-shadow:inset 0 0 0 2px var(--red)}
.crow .ic svg{width:13px;height:13px}
.crow .cnt{font-size:10.5px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--ink);padding:0 5px;letter-spacing:.03em}
.crow input{background:#fff;border:1.5px solid var(--ink);border-radius:0;padding:4px 8px;font-size:13px;min-width:0}

/* ===== 动画（贴/撕/粘回，保留原 keyframes 名） ===== */
@keyframes dropIn{0%{transform:rotate(-6deg) translateY(-20px) scale(.84);opacity:0}65%{transform:rotate(calc(var(--rot,0deg) * 2.2)) scale(1.04)}100%{transform:rotate(var(--rot,0deg)) scale(1);opacity:1}}
@keyframes tearOff{0%{transform:rotate(var(--rot,0deg)) scale(1);opacity:1}25%{transform:rotate(calc(var(--rot,0deg) * 2.5)) translateY(-8px) scale(1.03);opacity:1}100%{transform:rotate(38deg) translate(70px,-26px) scale(.28);opacity:0}}
@keyframes stickBack{0%{transform:rotate(-20deg) translate(50px,-18px) scale(.36);opacity:0}60%{transform:rotate(calc(var(--rot,0deg) * 2)) scale(1.05);opacity:1}100%{transform:rotate(var(--rot,0deg)) scale(1);opacity:1}}
.note.anim-in{animation:dropIn .42s cubic-bezier(.2,.9,.25,1.05) both}
.note.anim-tear{animation:tearOff .5s cubic-bezier(.5,0,.75,.4) forwards;pointer-events:none}
.note.anim-back{animation:stickBack .55s cubic-bezier(.2,.9,.25,1.05) both}
/* ===== 浮窗 = 功能面板（白底黑框直角） ===== */
.mask{position:fixed;inset:0;background:rgba(23,23,26,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:22px;border-radius:0;
  background:var(--paper);border:3px solid var(--ink);box-shadow:10px 10px 0 rgba(23,23,26,.25);position:relative}
.modal::before{content:"";position:absolute;top:-3px;left:-3px;width:54px;height:10px;background:var(--red)}
.modal h3{font-size:15px;font-weight:900;font-family:var(--fd);letter-spacing:.06em;margin-bottom:16px;display:flex;align-items:center;gap:8px;text-transform:uppercase;padding-bottom:8px;border-bottom:3px solid var(--ink)}
.modal h3::before{content:"";width:11px;height:11px;background:var(--red);flex:none}
.modal h3 .x{margin-left:auto;width:30px;height:30px;border:2px solid var(--ink);border-radius:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;line-height:1;padding:0}
.modal h3 .x:active{transform:translate(1px,1px);box-shadow:inset 0 0 0 2px var(--red)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:var(--ink);font-weight:900;letter-spacing:.06em;margin-bottom:5px;text-transform:uppercase}
.field label::before{content:"▸ ";color:var(--red)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:0;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(208,52,44,.14)}
.field select option{background:#fff;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* 课表格子（机械网格 + 刻度） */
.tt-grid{display:grid;grid-template-columns:38px repeat(7,1fr);gap:3px}
.tt-cell{aspect-ratio:1/.86;border:1.5px solid var(--ink);border-radius:0;padding:2px;font-size:10px;color:var(--ink);line-height:1.25;overflow:hidden;cursor:pointer;background:#fff;transition:background .12s;display:flex;align-items:center;justify-content:center;text-align:center}
.tt-cell:hover{background:rgba(208,52,44,.08)}
.tt-cell.hd{border:none;background:transparent;color:var(--ink);font-size:11px;font-weight:900;font-family:var(--fd);cursor:default;aspect-ratio:auto}
.tt-cell.hd:hover{background:transparent}
.tt-cell .cn{font-size:9.5px;line-height:1.2;word-break:break-all;font-weight:700}
.tt-cell input{width:100%;height:100%;background:#fff;border:1.5px solid var(--red);border-radius:0;color:var(--ink);font-size:10px;text-align:center;padding:2px}
/* 便签盒 */
.box-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.box-note{position:relative;padding:10px 12px;background:#fff;border:1.5px solid var(--ink);box-shadow:3px 3px 0 rgba(23,23,26,.16)}
.box-note::before{content:"";position:absolute;top:-1.5px;left:-1.5px;width:22px;height:7px;background:var(--red)}
.box-note .tx{font-size:13px;color:var(--ink);font-weight:700}
.box-note .meta{font-size:11px;color:var(--ink);font-weight:700;margin-top:4px;border-top:1px dashed var(--ink);padding-top:4px}
.box-note .acts2{display:flex;gap:6px;margin-top:8px}
.box-note .acts2 button{flex:1;min-height:34px;border:1.5px solid var(--ink);border-radius:0;font-size:12px;font-weight:900;background:var(--white);color:var(--ink)}
.box-note .acts2 button:hover{background:var(--ink);color:#fff}
.box-note .acts2 button:active{transform:translate(1px,1px);box-shadow:inset 0 0 0 2px var(--red)}
.box-note .acts2 button.rm:hover{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--ink);font-size:13px;font-weight:700;padding:24px 8px;grid-column:1/-1;border:1.5px dashed var(--ink)}

/* 移动端底部 Tab */
.tabs{display:none}
footer{margin-top:14px;text-align:center;font-size:10.5px;color:var(--ink);font-weight:700;letter-spacing:.06em;border-top:2px solid var(--ink);padding-top:10px}

/* ===== 响应式 ===== */
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .zones{grid-template-columns:1fr}
  .sched{position:static}
  .wrap{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:var(--paper);border-top:3px solid var(--ink)}
  .tabs button{flex:1;min-height:52px;border:none;background:none;color:var(--ink);font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:0;font-family:var(--fd)}
  .tabs button svg{width:18px;height:18px}
  .tabs button.on{color:#fff;background:var(--ink)}
  .tabs button.on svg{color:var(--red)}
  .tabs button .nb{position:absolute;transform:translate(14px,-10px);font-size:9px;background:var(--red);color:#fff;border-radius:0;padding:0 5px;font-weight:900}
  .zone.hide-m{display:none}
  .sched.hide-m{display:none}
  .board.tabs-on .zone{display:flex}
  .box-list{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
}
@media (max-width:640px){
  .notes{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .titleblock{display:none}
  .ruler-r{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="regmarks" aria-hidden="true">
  <span class="cr c-tl"></span><span class="cr c-tr"></span><span class="cr c-bl"></span><span class="cr c-br"></span>
  <span class="ruler-r"></span>
  <span class="titleblock"><b>星之间 · 便签墙</b><span><em>SCALE</em>1:1</span><span><em>SHEET</em>A-01</span><span><em>DWG</em>CONSTRUCTIVISM</span></span>
</div>
<div class="papertex" aria-hidden="true"></div>

<!-- hidden SVG defs：feTurbulence 极淡纸感 + 工程符号 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <div class="acts">
    <button class="btn primary" onclick="openNew()"><svg class="zh-ico" width="15" height="15"><use href="#arrR"/></svg>写便签</button>

</header>

<div class="main">

<script>
/* ================= 数据层 ================= */
var LS='wb_xzj_wall_v1';
var DAYS=['一','二','三','四','五','六','日'];
var DAYKEY=['mon','tue','wed','thu','fri','sat','sun'];
var state=null;

function defaultState(){
  var t=new Date();t.setFullYear(t.getFullYear());
  return {
    v:1,
    settings:{examDate:'2026-12-19'},
    notes:[
      {id:uid(),board:'kaoyan',title:'英语真题精讲一套（2019 阅读）',due:isoOffset(-2),time:'',courseId:'',done:false,tone:'day',createdAt:Date.now()},
      {id:uid(),board:'kaoyan',title:'高数每日一练 · 定积分专题',due:isoOffset(0),time:'',courseId:'',done:false,tone:'night',createdAt:Date.now()},
      {id:uid(),board:'course',title:'操作系统论文查重并提交',due:isoOffset(1),time:'',courseId:'c4',done:false,tone:'morning',createdAt:Date.now()},
      {id:uid(),board:'todo',title:'图书馆还书（三本）',due:isoOffset(4),time:'',courseId:'',done:false,tone:'day',createdAt:Date.now()},
      {id:uid(),board:'life',title:'给爸妈打电话',due:isoOffset(0),time:'21:00',courseId:'',done:false,tone:'night',createdAt:Date.now()}
    ],
    schedule:[
      {id:uid(),time:'07:00',label:'起床 + 早饭'},
      {id:uid(),time:'08:30',label:'自习 · 数学'},
      {id:uid(),time:'12:00',label:'午饭 + 午休'},
      {id:uid(),time:'14:00',label:'上课 / 实验'},
      {id:uid(),time:'19:00',label:'自习 · 英语 + 政治'},
      {id:uid(),time:'23:00',label:'洗漱 · 睡觉'}
    ],
    courses:[
      {id:'c1',name:'高等数学 A'},{id:'c2',name:'数据结构'},
      {id:'c3',name:'大学英语 III'},{id:'c4',name:'操作系统'}
    ],
    timetable:{
      'mon-1':'高等数学 A','mon-3':'数据结构',
      'tue-1':'大学英语 III','tue-3':'操作系统',
      'wed-1':'高等数学 A','thu-3':'数据结构','fri-1':'大学英语 III'
    }
  };
}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function isoOffset(d){var t=new Date();t.setDate(t.getDate()+d);return t.toISOString().slice(0,10)}
function todayISO(){return new Date().toISOString().slice(0,10)}

function load(){
  try{
    var raw=localStorage.getItem(LS);
    if(raw){state=JSON.parse(raw);}
    else{state=defaultState();save();}
  }catch(e){state=defaultState();}
  if(!state.notes)state.notes=[];
  if(!state.schedule)state.schedule=[];
  if(!state.courses)state.courses=[];
  if(!state.timetable)state.timetable={};
  if(!state.settings)state.settings={examDate:'2026-12-19'};
}
function save(){localStorage.setItem(LS,JSON.stringify(state));}

/* ================= 计算层 ================= */
function activeNotes(){return state.notes.filter(function(n){return !n.done})}
function tornNotes(){return state.notes.filter(function(n){return n.done}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)})}
function daysLeft(){var d=new Date(state.settings.examDate+'T00:00:00');var n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.round((d-n)/86400000))}
function dueLabel(n){
  if(!n.due)return '';
  var t=new Date(todayISO()+'T00:00:00'),d=new Date(n.due+'T00:00:00');
  var diff=Math.round((d-t)/86400000);
  if(diff<0)return {txt:'逾期 '+(-diff)+' 天',cls:'over'};
  if(diff===0)return {txt:'今天'+(n.time?' '+n.time:''),cls:'soon'};
  if(diff===1)return {txt:'明天'+(n.time?' '+n.time:''),cls:'soon'};
  if(diff<=3)return {txt:diff+' 天后',cls:'soon'};
  return {txt:n.due.slice(5).replace('-','/'),cls:''};
}
function courseName(id){var c=state.courses.filter(function(x){return x.id===id})[0];return c?c.name:''}

/* ================= 渲染层（只被 refreshAll 调用，互不调用） ================= */
function renderCountdown(){document.getElementById('cdDays').textContent=daysLeft();}

function renderSched(){
  var box=document.getElementById('schedList');box.innerHTML='';
  state.schedule.sort(function(a,b){return a.time.localeCompare(b.time)});
  state.schedule.forEach(function(s){
    var row=document.createElement('div');row.className='srow';
    var tm=document.createElement('span');tm.className='tm';tm.textContent=s.time;
    var lb=document.createElement('span');lb.className='lb';lb.textContent=s.label;
    var del=document.createElement('button');del.className='del';del.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.onclick=function(){state.schedule=state.schedule.filter(function(x){return x.id!==s.id});save();refreshAll();};
    tm.onclick=function(){editSched(s,'time',tm)};
    lb.onclick=function(){editSched(s,'label',lb)};
    row.appendChild(tm);row.appendChild(lb);row.appendChild(del);
    box.appendChild(row);
  });
}
function editSched(s,key,el){
  var inp=document.createElement('input');
  inp.value=s[key];inp.type=(key==='time'?'time':'text');
  el.replaceWith(inp);inp.focus();
  var commit=function(){s[key]=inp.value.trim()||s[key];save();refreshAll();};
  inp.onblur=commit;inp.onkeydown=function(e){if(e.key==='Enter')commit();if(e.key==='Escape')refreshAll();};
}
function addSched(){
  state.schedule.push({id:uid(),time:'12:00',label:'新安排'});
  save();refreshAll();
}
function renderCourses(){
  var box=document.getElementById('courseList');box.innerHTML='';
  state.courses.forEach(function(c){
    var n=state.notes.filter(function(x){return !x.done&&x.courseId===c.id}).length;
    var row=document.createElement('div');row.className='crow';
    var nm=document.createElement('span');nm.className='nm';nm.textContent=c.name;
    nm.onclick=function(){
      var inp=document.createElement('input');
      inp.type='text';inp.maxLength=30;inp.value=c.name;
      inp.style.flex='1';inp.style.minWidth='0';inp.style.padding='4px 8px';inp.style.fontSize='13px';
      inp.style.border='1px solid rgba(255,235,200,.2)';inp.style.borderRadius='6px';
      inp.style.background='rgba(255,244,224,.08)';inp.style.color='var(--t1)';
      nm.replaceWith(inp);inp.focus();inp.select();
      var done=false;
      var commit=function(){
        if(done)return;done=true;
        var v=inp.value.trim();
        if(!v){
          if(confirm('删除课程「'+c.name+'」？它的待办便签会保留但解除关联')){
            state.courses=state.courses.filter(function(x){return x.id!==c.id});
            state.notes.forEach(function(x){if(x.courseId===c.id)x.courseId=''});
          }
        }else if(v!==c.name){c.name=v;}
        save();refreshAll();
      };
      inp.onblur=function(){commit()};
      inp.onkeydown=function(e){if(e.key==='Enter'){inp.blur();}if(e.key==='Escape'){inp.value=c.name;inp.blur();}};
    };
    var add=document.createElement('button');add.className='ic';add.title='给这门课贴待办便签';
    add.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    add.onclick=function(){openNew('course',c.id)};
    var cnt=document.createElement('span');cnt.className='cnt';cnt.textContent=n?n+' 待办':'';
    row.appendChild(nm);row.appendChild(cnt);row.appendChild(add);
    box.appendChild(row);
  });
}
function renderWall(){
  ['kaoyan','course','todo','life'].forEach(function(b){
    var box=document.getElementById('notes-'+b);
    var list=activeNotes().filter(function(n){return n.board===b});
    document.getElementById('cnt-'+b).textContent=list.length?list.length+' 张':'';
    box.innerHTML='';
    if(!list.length){
      var eh=document.createElement('div');eh.className='note empty-hint';
      eh.textContent='这面墙还空着 · 点 + 贴一张';
      box.appendChild(eh);return;
    }
    list.forEach(function(n){
      var el=document.createElement('div');
      el.className='note tone-'+(n.tone||'day');
      el.style.setProperty('--rot',((n.id.charCodeAt(0)%5)-2)*0.6+'deg');
      el.draggable=true;el.dataset.id=n.id;
      var tx=document.createElement('div');tx.className='tx';tx.textContent=n.title;
      var meta=document.createElement('div');meta.className='meta';
      var d=dueLabel(n);
      if(d){var s1=document.createElement('span');s1.className=d.cls;s1.textContent=d.txt;meta.appendChild(s1);}
      if(n.courseId){var s2=document.createElement('span');s2.textContent='· '+courseName(n.courseId);meta.appendChild(s2);}
      var tear=document.createElement('button');tear.className='tear';tear.title='撕下（完成并收进便签盒）';
      tear.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 4v6h6"/></svg>';
      tear.onclick=function(ev){ev.stopPropagation();tearNote(n.id,el);};
      el.appendChild(tx);el.appendChild(meta);el.appendChild(tear);
      el.ondragstart=function(e){e.dataTransfer.setData('text/plain',n.id);el.style.opacity=.4};
      el.ondragend=function(){el.style.opacity=1};
      box.appendChild(el);
    });
  });
}
function renderBox(){
  var list=tornNotes();
  document.getElementById('boxCnt').textContent=list.length;
  document.getElementById('boxSub').textContent=list.length?'（'+list.length+' 张，可粘回）':'（空的）';
  var box=document.getElementById('boxList');box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="empty">还没有撕下的便签——完成的事撕下来就进这儿</div>';return;}
  list.forEach(function(n){
    var el=document.createElement('div');el.className='box-note';
    var tx=document.createElement('div');tx.className='tx';tx.textContent=n.title;
    var meta=document.createElement('div');meta.className='meta';
    meta.textContent='来自「'+boardName(n.board)+'」 · 撕于 '+new Date(n.doneAt||Date.now()).toLocaleDateString('zh-CN');
    var acts=document.createElement('div');acts.className='acts2';
    var bk=document.createElement('button');bk.textContent='粘回墙上';bk.onclick=function(){restoreNote(n.id)};
    var rm=document.createElement('button');rm.className='rm';rm.textContent='彻底丢掉';
    rm.onclick=function(){state.notes=state.notes.filter(function(x){return x.id!==n.id});save();refreshAll();};
    acts.appendChild(bk);acts.appendChild(rm);
    el.appendChild(tx);el.appendChild(meta);el.appendChild(acts);
    box.appendChild(el);
  });
}
function boardName(b){return {kaoyan:'考研备考',course:'学期科目',todo:'待办',life:'生活事项'}[b]||b}

function renderTT(){
  var g=document.getElementById('ttGrid');g.innerHTML='';
  var c0=document.createElement('div');c0.className='tt-cell hd';c0.textContent='';g.appendChild(c0);
  DAYS.forEach(function(d){var c=document.createElement('div');c.className='tt-cell hd';c.textContent=d;g.appendChild(c)});
  for(var s=1;s<=10;s++){
    var h=document.createElement('div');h.className='tt-cell hd';h.textContent=s;g.appendChild(h);
    DAYKEY.forEach(function(dk){
      var key=dk+'-'+s;
      var c=document.createElement('div');c.className='tt-cell';
      var v=state.timetable[key];
      c.innerHTML=v?'<span class="cn">'+esc(v)+'</span>':'';
      c.onclick=function(){
        if(c.querySelector('input'))return;
        c.innerHTML='';
        var inp=document.createElement('input');inp.value=v||'';c.appendChild(inp);inp.focus();
        var commit=function(){
          var val=inp.value.trim();
          if(val)state.timetable[key]=val;else delete state.timetable[key];
          save();refreshAll();
        };
        inp.onblur=commit;inp.onkeydown=function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')refreshAll();};
      };
      g.appendChild(c);
    });
  }
}
function renderCourseMgr(){
  var box=document.getElementById('courseMgr');box.innerHTML='';
  state.courses.forEach(function(c){
    var row=document.createElement('div');row.className='crow';
    var nm=document.createElement('span');nm.className='nm';nm.textContent=c.name;
    nm.onclick=function(){
      var inp=document.createElement('input');
      inp.type='text';inp.maxLength=30;inp.value=c.name;
      inp.style.flex='1';inp.style.minWidth='0';inp.style.padding='4px 8px';inp.style.fontSize='13px';
      inp.style.border='1px solid rgba(255,235,200,.2)';inp.style.borderRadius='6px';
      inp.style.background='rgba(255,244,224,.08)';inp.style.color='var(--t1)';
      nm.replaceWith(inp);inp.focus();inp.select();
      var commit=function(){
        var v=inp.value.trim();
        if(v){c.name=v;save();refreshAll();}
        else{refreshAll();}
      };
      inp.onblur=function(){commit()};
      inp.onkeydown=function(e){if(e.key==='Enter'){inp.blur();}if(e.key==='Escape'){refreshAll();}};
    };
    var del=document.createElement('button');del.className='ic';del.title='删除课程';
    del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.onclick=function(){state.courses=state.courses.filter(function(x){return x.id!==c.id});state.notes.forEach(function(x){if(x.courseId===c.id)x.courseId=''});save();refreshAll();};
    row.appendChild(nm);row.appendChild(del);box.appendChild(row);
  });
  var add=document.createElement('button');add.className='btn';add.style.marginTop='6px';add.textContent='+ 加一门课';
  add.onclick=function(){
    var inp=document.createElement('input');
    inp.type='text';inp.maxLength=30;inp.placeholder='输入课程名，回车添加';
    inp.style.marginTop='6px';inp.style.width='100%';inp.style.padding='8px 10px';
    inp.style.border='1px solid rgba(255,235,200,.2)';inp.style.borderRadius='8px';
    inp.style.background='rgba(255,244,224,.06)';inp.style.color='var(--t1)';inp.style.fontSize='14px';
    add.replaceWith(inp);inp.focus();
    var commit=function(){
      var v=inp.value.trim();
      if(v){state.courses.push({id:uid(),name:v});save();refreshAll();}
      else{refreshAll();}
    };
    inp.onblur=function(){commit()};
    inp.onkeydown=function(e){if(e.key==='Enter'){inp.blur();}if(e.key==='Escape'){refreshAll();}};
  };
  box.appendChild(add);
}
function renderCourseOptions(){
  var sel=document.getElementById('nCourse');
  var cur=sel.value;
  sel.innerHTML='<option value="">（不关联）</option>';
  state.courses.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o)});
  sel.value=cur;
}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

function refreshAll(){
  renderCountdown();renderSched();renderCourses();renderWall();renderBox();renderTT();renderCourseMgr();renderCourseOptions();
}

/* ================= 行为层（改数据 → 保存 → refreshAll） ================= */
function openNew(board,courseId){
  document.getElementById('nTitle').value='';
  document.getElementById('nBoard').value=board||'todo';
  document.getElementById('nDue').value='';
  document.getElementById('nTime').value='';
  renderCourseOptions();
  if(courseId)document.getElementById('nCourse').value=courseId;
  openMask('mNew');
  setTimeout(function(){document.getElementById('nTitle').focus()},80);
}
function addNote(){
  var t=document.getElementById('nTitle').value.trim();
  if(!t){alert('便签不能是空的');return;}
  var b=document.getElementById('nBoard').value;
  var tones=['morning','day','night'];
  state.notes.push({
    id:uid(),board:b,title:t,due:document.getElementById('nDue').value,
    time:document.getElementById('nTime').value,courseId:document.getElementById('nCourse').value,
    done:false,tone:tones[Math.floor(Math.random()*3)],createdAt:Date.now()
  });
  save();closeMask('mNew');refreshAll();
  // 落贴动画
  var zone=document.getElementById('notes-'+b);
  var last=zone.lastElementChild;
  if(last){last.classList.add('anim-in');}
}
function tearNote(id,el){
  el.classList.add('anim-tear');
  setTimeout(function(){
    var n=state.notes.filter(function(x){return x.id===id})[0];
    if(n){n.done=true;n.doneAt=Date.now();}
    save();refreshAll();
  },480);
}
function restoreNote(id){
  var n=state.notes.filter(function(x){return x.id===id})[0];
  if(!n)return;
  n.done=false;n.doneAt=null;
  save();closeMask('mBox');refreshAll();
  var zone=document.getElementById('notes-'+n.board);
  var els=zone.querySelectorAll('.note');
  for(var i=0;i<els.length;i++){
    if(els[i].dataset.id===id){els[i].classList.add('anim-back');break;}
  }
}
function clearBox(){
  if(!confirm('清空便签盒？撕下的便签会彻底丢掉（不可恢复）。'))return;
  state.notes=state.notes.filter(function(n){return !n.done});
  save();refreshAll();
}
function openMask(id){document.getElementById(id).classList.add('on')}
function closeMask(id){document.getElementById(id).classList.remove('on')}
function openTT(){openMask('mTT')}
function openBox(){openMask('mBox')}
function exportJSON(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='星之间-便签墙-'+todayISO()+'.json';a.click();
}
function importJSON(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!d.notes)throw 0;
      if(!confirm('导入会覆盖当前全部数据，确定？'))return;
      state=d;
      if(!state.notes)state.notes=[];
      if(!state.schedule)state.schedule=[];
      if(!state.courses)state.courses=[];
      if(!state.timetable)state.timetable={};
      if(!state.settings)state.settings={examDate:'2026-12-19'};
      save();refreshAll();alert('导入成功');
    }catch(e){alert('文件格式不对');}
    inp.value='';
  };
  r.readAsText(f);
}

/* ================= 拖放（桌面：便签换墙） ================= */
['kaoyan','course','todo','life'].forEach(function(b){
  var z=document.getElementById(b==='kaoyan'?'zone-kaoyan':'zone-'+b);
  z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('dragover')});
  z.addEventListener('dragleave',function(){z.classList.remove('dragover')});
  z.addEventListener('drop',function(e){
    e.preventDefault();z.classList.remove('dragover');
    var id=e.dataTransfer.getData('text/plain');
    var n=state.notes.filter(function(x){return x.id===id})[0];
    if(n&&n.board!==b){n.board=b;save();refreshAll();}
  });
});

/* ================= 移动端 Tab ================= */
document.getElementById('mtabs').addEventListener('click',function(e){
  var btn=e.target.closest('button');if(!btn)return;
  var v=btn.dataset.v;
  if(v==='box'){openBox();return;}   // 便签盒是浮窗，不常驻 Tab 高亮
  document.querySelectorAll('#mtabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  var sched=document.getElementById('schedCard');
  closeMask('mBox');
  ['kaoyan','course','todo','life'].forEach(function(b){
    document.getElementById('zone-'+b).style.display=(v==='all'||v===b)?'':'none';
  });
  sched.style.display=(v==='all')?'':'none';
});

/* ================= 启动 ================= */
document.addEventListener('DOMContentLoaded',function(){
  load();
  refreshAll();
  document.querySelectorAll('.mask').forEach(function(m){
    m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('on')});
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.mask').forEach(function(m){m.classList.remove('on')})});
});
</script>
</body>
